// ---------- 结构化笔记（map-reduce） ----------
async function runAiNote(taskId){
  const box = document.getElementById('noteBox-' + taskId);
  if(!box) return;
  box.innerHTML = '<div class="loading show"><div class="spinner"></div>'
    + '<span>正在生成结构化笔记（分块提取 + 汇总，约 1-2 分钟）...</span></div>';
  try{
    const r = await fetch(API + '/ai/note', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({taskId})
    });
    const j = await r.json();
    if(!r.ok || !j.data){
      const m = j.msg || '生成失败';
      box.innerHTML = '<div class="msg error show">' + escapeHtml(m) + '</div>';
      notify(m, 'error');
      return;
    }
    const d = j.data;
    box.innerHTML = '<div class="card" style="margin-top:1rem;border-color:#ddd6fe">'
      + '<div class="meta"><span class="pill platform">结构化笔记 · ' + escapeHtml(d.model || '') + '</span>'
      + '<span class="pill dur">要点 ' + (d.keyPoints || 0) + ' · 金句 ' + (d.quotes || 0)
      + ' · 术语 ' + (d.terms || 0) + '</span>'
      + '<a class="copy" style="text-decoration:none" href="' + API + '/ai/note/download?taskId='
      + encodeURIComponent(taskId) + '">下载 .md</a></div>'
      + '<div class="section-label">笔记预览</div>'
      + '<pre class="note-preview">' + escapeHtml(d.markdown || '') + '</pre>'
      + '</div>';
  }catch(e){
    box.innerHTML = '<div class="msg error show">生成请求失败：' + escapeHtml(e.message) + '</div>';
  }
}

// ---------- 导出下载（对齐抖虫：4 种格式 + 单条/批量） ----------
const EXPORT_FORMATS=[
  {value:'txt',      label:'纯文本',    desc:'.txt 通用文本文件'},
  {value:'markdown', label:'Markdown',  desc:'.md 保留标题结构'},
  {value:'docx',     label:'Word 文档', desc:'.docx 办公编辑排版'},
  {value:'excel',    label:'Excel 表格',desc:'.xlsx 表格化管理'},
  {value:'srt',      label:'SRT 字幕',  desc:'.srt 带时间戳字幕'},
];
let _expSel='txt', _expIds=[], _expCorrected=false;

function notify(text,type){
  let el=document.getElementById('globalToast');
  if(!el){ el=document.createElement('div'); el.id='globalToast';
    el.style.cssText='position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:300;padding:.6rem 1.15rem;border-radius:999px;font-size:.85rem;font-weight:600;box-shadow:0 10px 26px rgba(0,0,0,.16);transition:opacity .25s;';
    document.body.appendChild(el); }
  el.textContent=text;
  const bad=type==='error';
  el.style.background=bad?'#fef2f2':'#ecfdf5'; el.style.color=bad?'#b91c1c':'#065f46';
  el.style.border='1px solid '+(bad?'#fecaca':'#a7f3d0'); el.style.opacity='1';
  clearTimeout(window.__toastT); window.__toastT=setTimeout(()=>{el.style.opacity='0';},2200);
}

function openExportModal(ids, corrected=false){
  _expIds=(ids||[]).filter(Boolean);
  _expCorrected=!!corrected;
  if(!_expIds.length){ notify('暂无可导出的任务','error'); return; }
  if(_expIds.length>100){ notify('单次最多导出 100 个任务','error'); return; }
  _expSel='txt';
  closeExportModal();
  const mask=document.createElement('div');
  mask.id='exportMask'; mask.className='modal-mask';
  mask.innerHTML='<div class="modal">'
    +'<div style="display:flex;align-items:center;justify-content:space-between">'
    +'<h3>选择导出格式</h3><button type="button" class="btn sm ghost" id="expClose">✕</button></div>'
    +'<div style="margin-top:.35rem;font-size:.78rem;color:#6b7280">共 '+_expIds.length+' 个任务'
    +(_expIds.length>1?' · 打包为 ZIP，每条记录一个文件':'')
    +(_expCorrected?' · <b style="color:#7c3aed">AI 纠错版</b>':'')+'</div>'
    +'<div class="fmt-grid" id="fmtGrid">'+EXPORT_FORMATS.map(f=>'<button type="button" class="fmt-card'+(f.value===_expSel?' sel':'')+'" data-fmt="'+f.value+'"><b>'+f.label+'</b><span>'+f.desc+'</span></button>').join('')+'</div>'
    +'<label style="display:flex;align-items:flex-start;gap:.45rem;margin-top:.7rem;font-size:.8rem;color:#374151;line-height:1.5;cursor:pointer">'
    +'<input type="checkbox" id="expPlain" style="margin-top:.15rem">'
    +'<span><b>仅文案</b> —— 每个文件只含转写正文，不含标题/简介/链接等元数据（文件名仍带标题；对 Excel/SRT 无效）</span></label>'
    +'<div class="modal-foot"><button type="button" class="btn sm ghost" id="expCancel">取消</button>'
    +'<button type="button" class="btn sm" id="expConfirm">导出</button></div></div>';
  document.body.appendChild(mask);
  mask.addEventListener('click', e=>{ if(e.target===mask) closeExportModal(); });
  document.getElementById('fmtGrid').addEventListener('click', e=>{
    const c=e.target.closest('[data-fmt]'); if(!c) return;
    _expSel=c.dataset.fmt;
    mask.querySelectorAll('.fmt-card').forEach(x=>x.classList.toggle('sel', x.dataset.fmt===_expSel));
    const cb=document.getElementById('expPlain');
    if(cb && (_expSel==='srt'||_expSel==='excel')){ cb.checked=false; cb.disabled=true; }
    else if(cb){ cb.disabled=false; }
  });
  document.getElementById('expCancel').onclick=closeExportModal;
  document.getElementById('expClose').onclick=closeExportModal;
  document.getElementById('expConfirm').onclick=runExport;
}

function closeExportModal(){ const m=document.getElementById('exportMask'); if(m) m.remove(); }
// 2026-11-05：Esc 也能关导出弹窗（此前只能点「取消」/遮罩）
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeExportModal();
});

async function runExport(){
  const btn=document.getElementById('expConfirm');
  if(btn){ btn.disabled=true; btn.textContent='导出中...'; }
  try{
    const plain=(document.getElementById('expPlain')||{}).checked?1:0;
    let resp;
    if(_expIds.length===1){
      resp=await fetch(`${API}/ai-face/exportTask?taskId=${encodeURIComponent(_expIds[0])}&format=${_expSel}&lang=zh`
        +(_expCorrected?'&corrected=1':'')+'&plain='+plain);
    }else{
      resp=await fetch(`${API}/ai-face/exportTasks`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({taskIds:_expIds,format:_expSel,lang:'zh',corrected:_expCorrected?1:0,plain:plain})});
    }
    const ct=resp.headers.get('content-type')||'';
    if(!resp.ok || ct.includes('json')){
      let msg='导出失败，请稍后重试';
      try{ const j=await resp.json(); if(j&&j.msg) msg=j.msg; }catch(e){}
      notify(msg,'error'); return;
    }
    const blob=await resp.blob();
    let name = _expIds.length>1
      ? 'transcripts_'+_expIds.length+'.zip'
      : 'transcript.'+(_expSel==='markdown'?'md':_expSel==='excel'?'xlsx':_expSel);
    const cd=resp.headers.get('content-disposition')||'';
    const m=cd.match(/filename="?([^";]+)"?/i); if(m) name=m[1].trim();
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    closeExportModal();
    notify(_expIds.length>1 ? '已导出 '+_expIds.length+' 个文件（ZIP）' : '导出成功');
  }catch(e){ notify('导出失败: '+e.message,'error'); }
  finally{ if(btn){ btn.disabled=false; btn.textContent='导出'; } }
}

// ---------- 设置页：可视化编辑常用配置（保存即生效）----------
window.loadSettings = async function(){
  const box = document.getElementById('settingsForm');
  if(!box) return;
  let data;
  try{
    const r = await fetch(API+'/settings', {credentials:'same-origin'});
    const j = await r.json();
    if(!r.ok || j.code!==200) throw new Error(j.msg||('HTTP '+r.status));
    data = j.data;
  }catch(e){
    box.innerHTML = '<div class="card" style="color:#b91c1c">读取配置失败：'
      + escapeHtml(String(e.message||e)) + '</div>';
    return;
  }
  const groups = (data && data.groups) || [];
  if(!groups.length){ box.innerHTML='<div class="card">没有可配置项</div>'; return; }

  let html = '';
  for(const g of groups){
    html += '<div class="card"><div class="section-label">'+escapeHtml(g.group)+'</div>';
    for(const it of g.items){
      const id = 'set_'+it.key;
      let ctl;
      if(it.kind.indexOf('enum:') === 0){
        // 枚举一律用下拉框，避免手填出错
        const opts = it.kind.slice(5).split(',');
        ctl = '<select id="'+id+'" data-key="'+it.key+'" style="width:100%;padding:.8rem 1rem;'
          + 'border:1px solid var(--border);border-radius:12px;font-size:.92rem;'
          + 'background:#fdfbff;font-family:inherit;">'
          + opts.map(function(o){
              return '<option value="'+escapeHtml(o)+'"'
                + (o === it.value ? ' selected' : '') + '>'
                + escapeHtml(o) + '</option>';
            }).join('')
          + '</select>';
      }else if(it.kind === 'proxy_list'){
        // 出口池：一条一行，配到几条就加几行（比塞进一个大文本框直观得多）
        const vals = (it.value||'').split(/[,\s]+/).filter(Boolean);
        if(!vals.length) vals.push('');
        ctl = '<div class="px-list" data-key="'+it.key+'">'
          + vals.map(function(v){
              return '<div class="px-row" style="display:flex;gap:.5rem;margin-bottom:.55rem">'
                + '<input type="text" class="px-input" style="flex:1" '
                + 'value="'+escapeHtml(v)+'" placeholder="host:port 或 http://host:port">'
                + '<button type="button" class="btn sm ghost px-del" title="删除这条">✕</button>'
                + '</div>';
            }).join('')
          + '<button type="button" class="btn sm ghost px-add">+ 添加代理</button>'
          + '</div>';
      }else{
        ctl = '<input type="text" id="'+id+'" data-key="'+it.key+'" '
          + 'value="'+escapeHtml(it.value||'')+'" '
          + 'placeholder="' + (it.kind==='int' ? '留空=用默认值' : '留空=直连') + '">';
      }
      html += '<div style="margin-top:1rem">'
        + '<div style="font-size:.86rem;font-weight:600;margin-bottom:.35rem">'
        + escapeHtml(it.label) + '</div>'
        + ctl
        + '<div class="input-hint">'
        + '<span class="hint-note">' + escapeHtml(it.hint||'') + '</span>'
        + ' <code>' + escapeHtml(it.key) + '</code>'
        + '</div>'
        + '</div>';
    }
    html += '</div>';
  }
  html += '<div class="card">'
    + '<div class="row">'
    + '<button class="btn" id="settingsSave">保存并立即生效</button>'
    + '<button class="btn sm ghost" id="settingsCheck">测试出口连通性</button>'
    + '</div>'
    + '<div class="input-hint">'
    + '<span id="settingsMsg" style="font-weight:600"></span>'
    + '<span id="settingsCheckMsg"></span>'
    + '</div>'
    + '<div class="input-hint" style="margin-top:.8rem">'
    + '<span class="hint-note">保存后同时写回 .env，重启也保留</span><br>'
    + '<span class="hint-note">出口池填多条时，代码会为每个账号<b>稳定绑定</b>一条出口；冷却只罚被限的那一条</span><br>'
    + '<span class="hint-note">媒体下载出口留空 = 直连，省流量（按流量计费务必留空）</span><br>'
    + '<span class="hint-note">改完可到 <a href="#/accounts">账号</a> 页点「验证」再次确认</span>'
    + '</div></div>';
  box.innerHTML = html;

  // 出口池：每行一个输入框，「+ 添加代理」加一行，✕ 删一行
  function bindPxDel(delBtn){
    delBtn.onclick = function(){
      const row = delBtn.closest('.px-row');
      if(row) row.remove();
    };
  }
  box.querySelectorAll('.px-del').forEach(bindPxDel);
  box.querySelectorAll('.px-add').forEach(function(addBtn){
    addBtn.onclick = function(){
      const wrap = addBtn.parentElement;
      const row = document.createElement('div');
      row.className = 'px-row';
      row.style.cssText = 'display:flex;gap:.5rem;margin-bottom:.55rem';
      row.innerHTML = '<input type="text" class="px-input" style="flex:1" '
        + 'placeholder="host:port 或 http://host:port">'
        + '<button type="button" class="btn sm ghost px-del" title="删除这条">✕</button>';
      wrap.insertBefore(row, addBtn);
      bindPxDel(row.querySelector('.px-del'));
      const inp = row.querySelector('.px-input');
      if(inp) inp.focus();
    };
  });

  const btn = document.getElementById('settingsSave');
  btn.onclick = async function(){
    const values = {};
    box.querySelectorAll('[data-key]').forEach(function(el){
      if(el.classList.contains('px-list')){
        // 出口池：把每一行拼回逗号分隔
        const arr = [];
        el.querySelectorAll('.px-input').forEach(function(i){
          const v = (i.value || '').trim();
          if(v) arr.push(v);
        });
        values[el.dataset.key] = arr.join(',');
      }else{
        values[el.dataset.key] = el.value || '';
      }
    });
    btn.disabled = true;
    const msg = document.getElementById('settingsMsg');
    msg.style.color = 'var(--muted)';
    msg.textContent = '保存中…';
    try{
      const r = await fetch(API+'/settings', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({values: values})
      });
      const j = await r.json();
      if(j.code === 200){
        msg.style.color = '#047857';
        msg.textContent = '✓ 已保存并立即生效';
      }else{
        const errs = Object.keys((j.data && j.data.errors) || {})
          .map(function(k){ return k + '：' + j.data.errors[k]; }).join('；');
        msg.style.color = '#b91c1c';
        msg.textContent = '部分未生效：' + (errs || j.msg || '未知错误');
      }
    }catch(e){
      msg.style.color = '#b91c1c';
      msg.textContent = '保存失败：' + (e.message || e);
    }finally{
      btn.disabled = false;
    }
  };

  // 「测试出口连通性」：填完代理点一下就知道通不通，不用拿任务试错
  const chk = document.getElementById('settingsCheck');
  chk.onclick = async function(){
    const m = document.getElementById('settingsCheckMsg');
    chk.disabled = true;
    m.style.color = 'var(--muted)';
    m.textContent = '正在测试…（每个出口最多 8 秒）';
    try{
      const r = await fetch(API+'/proxy/check', {
        method:'POST', credentials:'same-origin'
      });
      const j = await r.json();
      const data = j.data || {};
      const lines = [];
      Object.keys(data).forEach(function(k){
        const v = data[k] || {};
        if(v.direct){
          lines.push(k + '：未配置代理（直连）');
          return;
        }
        lines.push(k + '：' + (v.detail || ''));
        (v.items || []).forEach(function(it){
          lines.push('   ' + (it.ok ? '✓' : '✗') + '  ' + (it.proxy || '?')
            + '   ' + (it.detail || '')
            + (it.ms ? '   ' + it.ms + 'ms' : ''));
        });
      });
      m.style.whiteSpace = 'pre-line';
      m.style.textAlign = 'left';
      m.style.color = (j.code === 200) ? '#047857' : '#b91c1c';
      m.textContent = lines.join('\n') || '没有配置任何代理（全部直连）';
      // 后端查出的问题（轮换型出口 / 境外 IP / 机房 IP）逐条弹窗
      const probs = Array.isArray(j.problems) ? j.problems : [];
      if (probs.length) {
        alert('代理配置有问题：\n\n'
          + probs.map(function(s, i){ return (i + 1) + '. ' + s; }).join('\n\n')
          + '\n\n提示：这类问题不会表现为"连不上"，但会让'
          + '「一号一 IP 稳定绑定」和「冷却按出口隔离」失效。');
      }
    }catch(e){
      m.style.color = '#b91c1c';
      m.textContent = '测试失败：' + (e.message || e);
    }finally{
      chk.disabled = false;
    }
  };
};
