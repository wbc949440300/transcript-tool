<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文案提取工具 - 视频/图片/文件转文字</title>
<style>
:root{
  --bg:#f8f7fc; --card:#fff; --brand:#7c3aed; --brand2:#d946ef;
  --text:#1b1b2f; --muted:#6b7280; --border:#ece7fa; --danger:#dc2626;
  --ok:#059669;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
a{color:inherit;text-decoration:none;}
/* ---------- 顶部导航 ---------- */
.navbar{position:sticky;top:0;z-index:50;background:rgba(248,247,252,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.nav-inner{max-width:920px;margin:0 auto;padding:.75rem 1.25rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;}
.brand{font-weight:800;font-size:1.15rem;background:linear-gradient(90deg,#7c3aed,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;}
.nav-links{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.nav-link{padding:.45rem .9rem;border-radius:999px;font-size:.9rem;font-weight:600;color:#374151;cursor:pointer;transition:.15s;position:relative;}
.nav-link:hover{background:#f1ebff;color:var(--brand);}
.nav-link.active{background:linear-gradient(90deg,#7c3aed,#d946ef);color:#fff;box-shadow:0 4px 14px rgba(217,70,239,.35);}
.dropdown{position:relative;}
.dropdown-caret{font-size:.7em;margin-left:2px;}
.dropdown-panel{position:absolute;top:calc(100% + 8px);left:0;min-width:560px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 50px rgba(31,20,70,.18);padding:1rem;display:none;z-index:60;max-height:76vh;overflow:auto;}
.dropdown-panel.open{display:block;}
.dd-section-title{font-size:.72rem;font-weight:800;letter-spacing:.08em;color:#a78bfa;text-transform:uppercase;margin:.8rem .4rem .2rem;display:flex;align-items:center;gap:.4rem;}
.dd-section-title:first-child{margin-top:.2rem;}
.dd-item{display:flex;align-items:center;gap:.75rem;padding:.55rem .6rem;border-radius:12px;cursor:pointer;transition:.12s;}
.dd-item:hover{background:#f6f1ff;}
.dd-item.active{background:#f3ecff;}
.dd-item .ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.dd-item .nm{font-weight:600;font-size:.9rem;}
.dd-item .go{margin-left:auto;color:#c4b5fd;font-size:.95rem;}
/* ---------- 主容器 ---------- */
.container{max-width:820px;margin:0 auto;padding:2rem 1.25rem 4rem;}
/* 视频号页：居中内容区（不铺满屏幕），左侧列表占 1/3 */
.container.qq-wide{max-width:1120px;}
.view{display:none;animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{text-align:center;margin-bottom:1.6rem;}
.hero h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,#6d28d9,#d946ef,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{color:var(--muted);margin-top:.5rem;font-size:.95rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.5rem;box-shadow:0 12px 40px rgba(124,58,237,.07);}
label{font-weight:700;font-size:.88rem;display:block;margin-bottom:.5rem;}
textarea,input[type=text]{width:100%;padding:.8rem 1rem;border:1px solid var(--border);border-radius:12px;font-size:.92rem;outline:none;background:#fdfbff;resize:vertical;font-family:inherit;}
textarea:focus,input[type=text]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,58,237,.12);}
.btn{background:linear-gradient(90deg,#7c3aed,#d946ef);color:#fff;border:none;border-radius:12px;padding:.8rem 1.5rem;font-size:.95rem;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 8px 22px rgba(217,70,239,.28);}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(217,70,239,.38);}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn.ghost{background:#fff;color:var(--brand);box-shadow:none;border:1px solid var(--border);}
.btn.sm{padding:.5rem .95rem;font-size:.82rem;box-shadow:none;}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-top:.9rem;}
select{padding:.55rem .8rem;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:.85rem;}
.msg{font-size:.85rem;border-radius:10px;padding:.6rem .9rem;margin-top:.8rem;display:none;}
.msg.show{display:block;}
.msg.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;}
.msg.info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;}
.msg.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;}
/* 2026-11-05：视频号「只有文案、没有视频」既不是成功也不是纯失败——琥珀色单独一档 */
.msg.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
.loading{display:none;align-items:center;gap:.8rem;color:#6d28d9;font-weight:600;font-size:.9rem;margin-top:1rem;}
/* ★ 2026-11-04：长进度文案（正在转写：0:02 / 1:11（预计还需约 3 分钟））会把 flex 里的
   spinner 横向压扁成椭圆（实测 13.19x20）——环形图标必须 flex:0 0 auto 不参与收缩，
   让文字自己换行。 */
.loading>span{flex:1 1 auto;min-width:0;line-height:1.5;overflow-wrap:anywhere;}
.loading.show{display:flex;}
.spinner{width:20px;height:20px;flex:0 0 auto;box-sizing:border-box;border:3px solid #e9d5ff;border-top-color:#7c3aed;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
/* 结果 */
#result{display:none;margin-top:1.2rem;}
#result.show{display:block;}
.meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0 .9rem;}
.pill{font-size:.72rem;font-weight:600;padding:.25rem .7rem;border-radius:999px;}
.pill.platform{background:#eef2ff;color:#4338ca;}
.pill.dur{background:#ecfdf5;color:#059669;}
.pill.status{background:#f3e8ff;color:#7c3aed;}
.result-title{font-size:1.1rem;font-weight:700;margin:.5rem 0 1rem;line-height:1.5;}
.section-label{font-size:.72rem;font-weight:700;letter-spacing:.1em;color:#a78bfa;text-transform:uppercase;margin:1.35rem 0 .45rem;clear:both;}
.variant-switch{display:inline-flex;background:#f3f0fb;border:1px solid var(--border);border-radius:999px;padding:2px;gap:2px}
.variant-switch button{border:0;background:transparent;color:var(--muted);font-size:.72rem;padding:.18rem .6rem;border-radius:999px;cursor:pointer;line-height:1.2}
.variant-switch button.active{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 3px rgba(124,58,237,.18)}

.desc{color:#34303f;line-height:1.7;font-size:.9rem;white-space:pre-wrap;}
.transcript{background:#fbfaff;border:1px solid var(--border);border-radius:14px;padding:1.1rem;font-size:.9rem;line-height:1.85;white-space:pre-wrap;max-height:380px;overflow:auto;}
.copy{background:#f3f0ff;border:1px solid var(--border);color:#6d28d9;border-radius:10px;padding:.4rem .9rem;font-size:.8rem;font-weight:600;cursor:pointer;margin-left:.5rem;float:right;}
.media video,.media audio{width:100%;border-radius:12px;background:#000;margin-top:.4rem;}
.bili-embed{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin-top:.4rem;}
.bili-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
.cover{width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-top:.4rem;background:#eee;}
/* 批量结果 */
.batch-item{border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;margin-bottom:.8rem;background:#fff;}
.batch-item .head{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;}
.batch-item .url{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.batch-item .txt{font-size:.88rem;line-height:1.7;white-space:pre-wrap;color:#34303f;max-height:140px;overflow:auto;margin-top:.4rem;}
.status-tag{font-size:.7rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;}
.status-tag.ok{background:#ecfdf5;color:#065f46;}
.status-tag.fail{background:#fef2f2;color:#b91c1c;}
.status-tag.run{background:#eff6ff;color:#1d4ed8;}
.status-tag.wait{background:#f3f4f6;color:#6b7280;}
.batch-progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:.6rem 0;}
.batch-progress>div{height:100%;background:linear-gradient(90deg,#7c3aed,#d946ef);width:0;transition:.3s;border-radius:99px;}
/* 历史记录 */
.h-item{display:flex;align-items:center;gap:1rem;justify-content:space-between;border:1px solid var(--border);border-radius:14px;padding:.8rem 1rem;margin-bottom:.6rem;background:#fff;transition:.12s;cursor:pointer;}
.h-item:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(124,58,237,.08);}
/* 视频截图缩略图带 */
.frame-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5rem;margin:.35rem 0 .2rem;}
.frame-strip img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:#f3f4f6;display:block;cursor:zoom-in;transition:transform .12s,box-shadow .12s;}
.frame-strip img:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.18);}
@media(max-width:640px){ .frame-strip{grid-template-columns:repeat(3,minmax(0,1fr));} }
/* 悬停浮空预览 */
#framePeek{position:fixed;z-index:400;pointer-events:none;opacity:0;transition:opacity .12s;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 48px rgba(17,24,39,.28);padding:4px;}
#framePeek img{display:block;border-radius:9px;}
/* 点击放大灯箱 */
#frameLightbox{position:fixed;inset:0;z-index:500;background:rgba(17,24,39,.84);display:none;align-items:center;justify-content:center;padding:3vh 3vw;cursor:zoom-out;}
#frameLightbox.open{display:flex;}
#frameLightbox img{max-width:94vw;max-height:94vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;}
.h-left{display:flex;align-items:center;gap:.8rem;flex:1;min-width:0;}
.h-type{flex-shrink:0;font-size:.68rem;font-weight:700;padding:.2rem .5rem;border-radius:8px;background:#f3e8ff;color:#7c3aed;}
.h-main{min-width:0;flex:1;}
.h-title{font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.h-sub{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.15rem;}
.input-hint{margin-top:.45rem;font-size:.76rem;color:#8b8794;line-height:1.9;}
.input-hint .hint-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:.35rem;margin-top:.1rem;}
.input-hint .hint-tag{flex:0 0 auto;display:inline-flex;align-items:center;color:#6b7280;background:#f3f4f6;border-radius:5px;padding:.02rem .35rem;font-size:.7rem;font-weight:600;line-height:1.6;}
.input-hint code{background:#f8f8fb;color:#52525b;border:1px solid #eef0f4;padding:.02rem .32rem;border-radius:5px;font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:.72rem;overflow-wrap:anywhere;}
.input-hint .hint-note{color:#9ca3af;font-size:.72rem;}
#vresult[data-stack] > .card{scroll-margin-top:76px;}
/* 视频号页两列布局：左侧 1/3 列表，右侧 2/3 结果/流程 */
.qq-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:1rem;align-items:start;}   /* 2026-11-05：单列满宽，原来左侧 330px 太窄 */
/* 还没有任何结果时右侧是全空的，两栏会让左侧显得又窄又空 → 空白态居中单栏 */
.qq-layout.qq-empty{grid-template-columns:minmax(0,1fr);}   /* 空结果时也占满整宽，别再缩成 760px */
.qq-layout.qq-empty .qq-main{display:none;}
.qq-side,.qq-main{display:flex;flex-direction:column;gap:1rem;min-width:0;}
.qq-main{order:1;} .qq-side{order:2;}   /* 结果在上，流程/设置在下 */
.qq-side .card,.qq-main .card{margin:0;}
.qq-side .row{flex-wrap:wrap;}
#vresult[data-stack]{display:flex;flex-direction:column;gap:1rem;}
/* 视频号结果里的竖屏视频限高居中，避免单条结果占满整屏 */
.qq-main .media:not(.media-stage) video{max-height:min(62vh,560px);width:auto;max-width:100%;margin:.4rem auto 0;display:block;}
/* ---------- 结果卡媒体区：统一"暗色舞台"，竖屏视频不再漂在白纸上 ---------- */
.media-stage{background:#0b0b12;border-radius:16px;padding:.55rem;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.media-stage video{width:100%;height:auto;max-width:100%;max-height:min(56vh,520px);aspect-ratio:16/9;object-fit:contain;border-radius:11px;background:#000;display:block;margin:0;}
.media-stage:has(.bili-embed){padding:0;background:#000;}
.media-stage.portrait{max-width:min(46%,340px);margin-left:auto;margin-right:auto;padding:.4rem;}
.media-stage.portrait video{width:auto;height:min(52vh,480px);max-width:100%;max-height:none;}
.media-bar{display:flex;align-items:center;gap:.6rem .85rem;flex-wrap:wrap;margin-top:.7rem;}
.media-tip{color:var(--muted);font-size:.78rem;line-height:1.6;flex:1 1 240px;min-width:220px;}
/* 状态提示块：取代散落在页面里的紫色小字+灰字 */
.notice{border-radius:12px;padding:.75rem .9rem;font-size:.82rem;line-height:1.75;display:flex;gap:.6rem;align-items:flex-start;margin-top:.5rem;}
.notice .n-ico{flex:0 0 auto;line-height:1.6;}
.notice b{font-weight:700;}
.notice.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;}
.notice.muted{background:#f9fafb;border:1px solid var(--border);color:#4b5563;}
/* ---------- 视频号左栏：卡片标题 / 列表行统一 ---------- */
.qq-card-title{display:flex;align-items:baseline;gap:.45rem;flex-wrap:wrap;margin:0 0 .55rem;}
.qq-card-title b{font-size:.92rem;font-weight:800;color:#312e42;}
.qq-card-title span{font-size:.74rem;color:var(--muted);}
.qq-list{display:flex;flex-direction:column;gap:.45rem;margin-top:.55rem;}
.qq-row{display:flex;align-items:center;gap:.6rem;border:1px solid var(--border);border-radius:12px;padding:.5rem .6rem;background:#fff;transition:.12s;cursor:pointer;text-align:left;width:100%;text-decoration:none;color:inherit;}
.qq-row:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(124,58,237,.10);}
.qq-row .qr-ico{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:#f5f0ff;display:flex;align-items:center;justify-content:center;font-size:.85rem;}
.qq-row .qr-main{min-width:0;flex:1;}
.qq-row .qr-title{font-size:.83rem;font-weight:600;color:#27223a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qq-row .qr-sub{font-size:.72rem;color:var(--muted);margin-top:.15rem;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap;}
.qq-row .qr-act{flex:0 0 auto;display:flex;gap:.35rem;align-items:center;}
.qq-row .ok{color:var(--ok);font-weight:700;}
.qq-row .bad,.qq-row .fail{color:var(--danger);font-weight:700;}
.qq-row .run{color:#6b7280;font-weight:700;}
.qq-sub{display:flex;align-items:center;justify-content:space-between;gap:.4rem;flex-wrap:nowrap;margin:.85rem 0 .35rem;padding-top:.65rem;border-top:1px dashed var(--border);font-size:.8rem;font-weight:700;color:#4b5563;}
.qq-sub>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qq-sub .btn{flex:0 0 auto;}
.qq-row.qq-task{cursor:default;padding:.45rem .55rem;}
.qq-prog{font-size:.72rem;color:#6d28d9;font-weight:700;}
.qq-bar{height:4px;border-radius:99px;background:#eee7fb;overflow:hidden;margin:.2rem 0 .15rem;}
.qq-bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a78bfa,#7c3aed);}
.qq-fail{font-size:.72rem;color:#b91c1c;line-height:1.55;margin:.15rem 0 .4rem;}
.qq-task+.qq-bar+.qq-fail{margin-top:.1rem;}
.qq-sub-note{font-weight:400;color:var(--muted);font-size:.72rem;margin-left:.35rem;}
.qq-side .card>details{margin-top:0;}
@media(max-width:1000px){ .qq-layout{grid-template-columns:1fr;} .qq-side{order:2;} .qq-main{order:1;} }
.h-time{color:#c0b7dc;font-size:.7rem;margin-top:.15rem;}
.h-right{display:flex;align-items:center;gap:.4rem;flex-shrink:0;}
/* 导出弹窗 */
.modal-mask{position:fixed;inset:0;z-index:100;background:rgba(15,10,40,.5);display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal{width:100%;max-width:26rem;background:#fff;border-radius:18px;padding:1.5rem;box-shadow:0 24px 60px rgba(20,10,60,.28);}
.modal h3{font-size:1.05rem;font-weight:800;color:#111827;}
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem;}
.fmt-card{display:flex;flex-direction:column;gap:.25rem;text-align:left;border:1px solid var(--border);border-radius:12px;padding:.8rem .9rem;background:#fff;cursor:pointer;transition:.12s;}
.fmt-card:hover{border-color:#f0abfc;background:#fdf4ff;}
.fmt-card.sel{border-color:transparent;background:#faf0ff;box-shadow:0 0 0 2px #d946ef;}
.fmt-card b{font-size:.88rem;color:#111827;}
.fmt-card.sel b{color:#a21caf;}
.fmt-card span{font-size:.72rem;color:#6b7280;}
.modal-foot{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.3rem;}
.h-check{width:16px;height:16px;accent-color:#7c3aed;flex-shrink:0;cursor:pointer;}
/* AI 纠错改动清单 */
.corr-list{margin:0;padding-left:1.1rem;font-size:.82rem;line-height:1.9;color:#374151;max-height:220px;overflow:auto;}
.corr-list code{background:#f3f0ff;color:#6d28d9;padding:.05rem .3rem;border-radius:5px;font-size:.8rem;word-break:break-all;}
/* 笔记预览 */
.note-preview{max-height:420px;overflow:auto;background:#fbfaff;border:1px solid var(--border);border-radius:12px;
  padding:1rem;font-family:ui-monospace,Consolas,"Microsoft YaHei",monospace;font-size:.8rem;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;color:#312e42;}
/* 文件上传 */
.dropzone{border:2px dashed var(--border);border-radius:16px;padding:2rem;text-align:center;cursor:pointer;transition:.15s;background:#fdfbff;}
.dropzone:hover,.dropzone.drag{border-color:var(--brand);background:#f6f1ff;}
.dropzone .dz-ico{font-size:2rem;}
.dropzone p{color:var(--muted);font-size:.88rem;margin-top:.4rem;}
.dropzone small{color:#9ca3af;}
/* 平台小卡片：按平台 */
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;}
.plat-chip{display:flex;align-items:center;gap:.5rem;border:1px solid var(--border);border-radius:12px;padding:.55rem .7rem;cursor:pointer;transition:.12s;font-weight:600;font-size:.85rem;background:#fff;}
.plat-chip:hover{border-color:var(--brand);background:#f6f1ff;}
.plat-chip.active{border-color:var(--brand);background:linear-gradient(90deg,#7c3aed,#d946ef);color:#fff;}
.plat-chip .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;flex-shrink:0;}
footer{text-align:center;color:#9ca3af;font-size:.8rem;margin-top:3rem;line-height:1.7;}
@media(max-width:640px){ .dropdown-panel{min-width:92vw;left:-220px;} }
.risk-banner{display:none;max-width:1120px;margin:.65rem auto 0;padding:.45rem .8rem;border:1px solid #fde68a;background:#fffbeb;color:#92400e;border-radius:10px;font-size:.8rem;line-height:1.5;text-align:center;}
.risk-banner.alert-danger{border-color:#fca5a5;background:#fef2f2;color:#b91c1c;}
/* 进行中任务找回条：蓝底，和风控的琥珀/红区分开 */
.risk-banner.active-banner{border-color:#bfdbfe;background:#eff6ff;color:#1d4ed8;}
.risk-banner.active-banner a{color:#1d4ed8;font-weight:600;text-decoration:underline;cursor:pointer;}
/* ---------- 发现页（B站搜索 / 抖音评论） ---------- */
.ds-hot{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.55rem 0 0}
.ds-head{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px dashed var(--border)}
.ds-item{display:flex;gap:.7rem;align-items:flex-start;padding:.65rem 0;border-bottom:1px solid var(--border)}
.ds-item:last-child{border-bottom:none}

// 避免已打开页面在重启后“所有接口都 401、列表看起来是空的”。
(function(){
  const _fetch = window.fetch.bind(window);
  window.fetch = async function(input, init){
    let r = await _fetch(input, init);
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if(r.status === 401 && url.indexOf('/prod-api/') >= 0){
      try{ await _fetch('/', {cache:'no-store'}); }catch(e){}
      r = await _fetch(input, init);
    }
    return r;
  };
})();

// ---------- 路由：每个功能一个独立 URL（支持"点功能 → 新标签页打开"）----------

/** 菜单项 → hash 路由 */
function urlFor(to, key){
  if(to==='video_text') return '#/video/'+(key||'douyin');
  if(to==='batch')      return '#/batch';
  if(to==='image')      return '#/image/'+(key||'ocr');
  if(to==='file')       return '#/file/'+((key==='audio')?'audio':'video');
  if(to==='accounts')   return '#/accounts';
  return '#/home';
}

/** hash → {view, key, taskId} */
function routeFromHash(){
  const raw=(location.hash||'').replace(/^#\/?/, '');
  const [path, query] = raw.split('?');
  const parts=path.split('/').filter(Boolean);
  const view=parts[0]||'home', key=parts[1]||'';
  const ok=['home','video','batch','image','file','discover','history','accounts','settings'];
  const taskId=new URLSearchParams(query||'').get('task')||'';
  return ok.includes(view) ? {view:view, key:key, taskId:taskId} : {view:'home', key:'', taskId:''};
}

/** 结果页直达地址（供历史记录新标签打开/刷新/收藏） */
function resultUrlFor(view, key, taskId){
  return '#/'+view+(key?'/'+key:'')+(taskId?'?task='+encodeURIComponent(taskId):'');
}

// 视频源不可用（防盗链/链接过期）时隐藏预览，不给用户一个转圈的坏播放器
// ★ 2026-11-04：抖音预览「进度条在走、画面不动」= 那条直链是 HEVC，而这个浏览器
// 只能硬解 H.265（显卡不支持 / 关了图形加速时就黑画面，canPlayType 还会返回 "probably"）。
// 所以不猜、只看事实：播了 1.5 秒却一帧都没解出来 → 换成 h264 那条直链重来一次。
window.videoStallFallback=function(v){
  try{
    if(!v || v.dataset.codecRetry) return false;
    const u=new URL(v.currentSrc||v.src, location.href);
    if(u.searchParams.get('codec')) return false;
    v.dataset.codecRetry='1';
    const t0=v.currentTime||0, wasPlaying=!v.paused;
    u.searchParams.set('codec','h264');
    v.src=u.toString();
    try{ v.load(); }catch(e){}
    // 换源会重置播放状态：用户本来在播，就接着播（并跳回原位置，期望位置在 h264 那条上同样有效）
    if(wasPlaying || t0>0.5){
      const resume=function(){
        try{ if(t0>0.5 && Math.abs(v.currentTime-t0)>1) v.currentTime=t0; }catch(e){}
        try{ v.play().catch(function(){}); }catch(e){}
      };
      v.addEventListener('loadedmetadata', resume, {once:true});
      setTimeout(resume, 2500);           // metadata 迟迟不来也别干等
    }
    const box=v.closest('.media');
    const tip=box? box.querySelector('[data-codec-tip]') : null;
    if(tip) tip.textContent='已自动切换 H.264 直链（原直链是 HEVC，当前浏览器只能硬件解码）。';
    // 二次兜底：换成 h264 后还是没画面 → 这个作品大概只有 HEVC，直接告诉用户怎么办，
    // 别让他对着一个"进度条在走"的黑屏等。
    setTimeout(function(){
      try{
        if(v.paused) return;
        const q=v.getVideoPlaybackQuality? v.getVideoPlaybackQuality() : null;
        if(q && (q.totalVideoFrames||0)===0 && tip){
          tip.textContent='这条作品只有 HEVC 编码，当前浏览器解不了；点「保存视频」用本机播放器看即可（文案提取不受影响）。';
        }
      }catch(e){}
    }, 6000);
    return true;
  }catch(e){ return false; }
};

window.mediaErr=function(el){
  // 解码/加载报错：先试一次 h264 直链，还是不行才隐藏（原来直接隐藏，等于把可修的当死路）
  if(window.videoStallFallback(el)) return;
  window.hideMedia(el);
};

// 竖屏视频：把暗色舞台收窄成"手机屏"比例，避免左右一大片黑边
if(!window.__stageOrient){
  window.__stageOrient=true;
  document.addEventListener('loadedmetadata', function(e){
    const v=e.target;
    if(!v || v.tagName!=='VIDEO') return;
    const stage=v.closest('.media-stage'); if(!stage) return;
    const portrait=(v.videoHeight||0) > (v.videoWidth||0) * 1.05;
    stage.classList.toggle('portrait', portrait);
    // 关键：<video poster> 在没有显式比例时会按封面图尺寸排版（横屏也被压成海报比例），
    // 这里用元数据里的真实宽高写死 aspect-ratio，宽度交给 CSS 撑满。
    if(v.videoWidth && v.videoHeight){ v.style.aspectRatio = v.videoWidth + '/' + v.videoHeight; }
  }, true);
}

if(!window.__videoStallWatch){
  window.__videoStallWatch=true;
  document.addEventListener('play', function(e){
    const v=e.target;
    if(!v || v.tagName!=='VIDEO' || !v.closest || !v.closest('[data-player-media]')) return;
    if(v.dataset.stallProbed) return;
    v.dataset.stallProbed='1';
    setTimeout(function(){
      try{
        if(v.paused || v.readyState<2 || v.currentTime<=0.2) return;
        const q=v.getVideoPlaybackQuality? v.getVideoPlaybackQuality() : null;
        const frames=q? (q.totalVideoFrames||0) : -1;
        if(frames===0) window.videoStallFallback(v);
      }catch(err){}
    }, 1500);
  }, true);
}

window.hideMedia=function(el){
  try{
    const box=el.closest('.media');
    if(box){
      // 卡片上若有「刷新直链」按钮就优先引导用它 —— 只重取一次详情、换上新地址，
      // 不重跑转写、文案不动。没有该按钮的平台才退回"重新提取"。
      const card=box.closest('.card');
      const hasRefresh=!!(card && card.querySelector('[data-refresh-media]'));
      box.innerHTML='<div style="color:var(--muted);font-size:.85rem;padding:.4rem 0">'
        +'视频源已过期或不可访问，已隐藏预览。'
        +(hasRefresh
            ? '点上方 <b>「刷新直链」</b> 换上新地址即可恢复（不会重跑转写，文案不动）；'
            : '')
        +'也可以重新提取（会重新转写一次，并新建一条记录）。</div>';
    }
  }catch(e){}
};

    .filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!=='').map(x=>escapeHtml(String(x[1]))+' '+x[0]).join(' · ');
  const sub=[];
  if(m.publishAt) sub.push('发布 '+escapeHtml(m.publishAt));

        ? '<div class="row" style="align-items:center;gap:.5rem;margin:.15rem 0 .5rem;flex-wrap:wrap">'
          +(m.headImg?'<img src="'+escapeHtml(m.headImg)+'" referrerpolicy="no-referrer" alt="" style="width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none">':'')
          +(d.uploader?'<span style="font-size:.85rem;font-weight:600">'+escapeHtml(d.uploader)+'</span>':'')
          +(sub.length?'<span style="color:var(--muted);font-size:.78rem">'+sub.join(' · ')+'</span>':'')
        +'</div>'
        : '')
    + (coverUrl ? '<img class="cover" src="'+coverEsc+'" alt="封面" onerror="this.style.display=\'none\'" style="max-width:min(240px,60%)">' : '')
    +'<div class="section-label">正文文案（作者发布时写的文字）</div>'
    +'<div class="transcript" data-copy-src="txt">'+(text||'(该作品没有正文文案)')+'</div>'
    + (tags?'<div class="row" style="gap:.35rem;margin-top:.5rem;flex-wrap:wrap">'+tags+'</div>' : '')

    +'<div class="media-bar">'
    +  '<button class="copy" data-export-task="'+tidEsc+'" data-tip="'+escapeHtml(TIPS.export)+'">导出下载</button>'
    +  '<button class="copy" data-copy="txt" data-tip="'+escapeHtml(TIPS.copy)+'">复制全文</button>'

        ? '这条作品<b>没有视频流</b>（可能是图集或已被删除），所以这里只有文案和封面。'
        : '还没绑定凭证，所以只拿到文案和封面，<b>没有视频</b>。'
          + '到左侧「账号」页绑定后重新提取即可出视频。')
    +'</div>'

  if (into.dataset && into.dataset.stack !== undefined) {
    into.querySelectorAll(':scope > .card').forEach((c, i, arr) => {

    into.insertBefore(card, into.firstChild);
    initTranscriptVariant(card);
    refreshQqResultTabs();
    return;

  into.innerHTML=h;

}

function renderVideoResult(d, into){
  // 视频号「链接模式」任务没有视频流，走专用卡片（否则会渲染出一堆空区）
  if(d.taskType==='videochannel'){ renderChannelCard(d, into); return; }
  const tid=d.taskId||'';
  const tidEsc=escapeHtml(tid);
  // 封面走代理，补 Referer，避免平台防盗链导致裂图
  const coverUrl=d.cover ? (tid ? API+'/media/cover?taskId='+encodeURIComponent(tid) : d.cover) : '';
  const coverEsc=escapeHtml(coverUrl);
  const platform=escapeHtml(d.platform||'通用');
  const title=escapeHtml(d.title||'(无标题)');
  const content=escapeHtml(d.content||'(无简介)');
  const text=escapeHtml(d.textContent||'(未识别到语音：该视频可能没有口播，例如纯音乐/MV/风景片；下方"作品简介"是作者的标题与话题)');
  // 没有口播（或口播极短）时，后端会把「画面文字」顶上当正文（extractor 的"字幕优先"）：
  // 此时 textContent 与 frameText 是同一份文本，两块钱都渲染就等于把同一段话显示两遍。

        +((d.taskType==='file_transcript'||platform==='本地文件')
            ? '本地文件直接从磁盘播放；原文件被移动或删除后，需要重新导入一次'
            : (canRefresh?'竖屏/横屏都能播；直链来自平台 CDN，几小时后过期，过期点「刷新直链」（不重新转写）'

    +  '<span>'+(bodyFromFrames?'文案（来自画面文字 OCR · 本片无口播）':'口播文案（全片语音转写）')+'</span>'
    +  '<span class="variant-switch" data-variant-switch>'
    +    '<button type="button" class="active" data-variant="s">简体</button>'
    +    '<button type="button" data-variant="t">繁体</button>'
    +  '</span>'
    +'</div>'
    +'<div class="transcript" data-copy-src="txt">'+text+'</div>'
    +(d.frameText && !bodyFromFrames
      ? ((String(d.frameMainText||'') || String(d.frameSceneText||''))
          ? (String(d.frameMainText||'')
              ? '<div class="section-label" style="margin-top:.7rem">作者文案（作者在画面中展示的文字）</div>'
                +'<div class="transcript" data-variant-ocr style="max-height:300px;overflow:auto">'+escapeHtml(d.frameMainText)+'</div>'
              : '')
            +(String(d.frameSceneText||'')
              ? '<div class="section-label" style="margin-top:.7rem">画面文字（画面背景/其他文字，OCR）</div>'
                +'<div class="transcript" data-variant-ocr style="max-height:300px;overflow:auto">'+escapeHtml(d.frameSceneText)+'</div>'
              : '')
          : '<div class="section-label" style="margin-top:.7rem">画面文字（OCR · 画面中出现的文字，与口播分开）</div>'
            +'<div class="transcript" data-variant-ocr style="max-height:300px;overflow:auto">'+escapeHtml(d.frameText)+'</div>')
      : '')
    +'<div id="aiBox-'+tidEsc+'"></div>'
    +'<div id="noteBox-'+tidEsc+'"></div>'
    +'</div>';
  // 堆叠模式（容器带 data-stack，视频号页用）：新结果插到最上面，旧结果保留在下方，最多 5 条
  if (into.dataset && into.dataset.stack !== undefined) {
    into.querySelectorAll(':scope > .card').forEach((c, i, arr) => {
      if (arr.length - i >= 5) c.remove();   // 插入新卡后保留最新 5 条
    });
    const wrap = document.createElement('div');
    wrap.innerHTML = h;
    const card = wrap.firstElementChild;
    const head = document.createElement('div');
    head.className = 'row';
    head.style.cssText = 'justify-content:space-between;margin:0 0 .4rem';
    head.innerHTML = '<span class="pill platform">刚提取</span>'

    card.prepend(head);
    into.insertBefore(card, into.firstChild);
    initTranscriptVariant(card);
    if (d.videoUrlList && d.videoUrlList.length) captureFrames(card, d.taskId || '');
    refreshQqResultTabs();
    return;
  }
  into.innerHTML=h;
  initTranscriptVariant(into);
  if(d.videoUrlList&&d.videoUrlList.length) captureFrames(into, d.taskId||'');
  // 视频号页：有了结果就切成左右两栏（原来靠 refreshQqResultTabs 顺带触发，标签条去掉后要自己叫）
  syncQqEmptyState();
}

// 视频截图：由**服务端 ffmpeg 抽帧**，前端只负责把结果 <img> 显示出来。
// ★ 2026-11-03 改：以前是浏览器另开一个 video 元素、seek 到 5 个时间点再 drawImage。
//   那条路要求"第二路流能及时缓冲到目标位置"，而抖音/B站 CDN 对同一条直链的并发流
//   本来就慢 —— 实测就是 seek 超时、截图全黑，失败率高到没法用。
//   （前面试过两种缓解：把元素从离屏改到视口内、把 preload 从 metadata 改 auto ——
//   都没解决，因为瓶颈不在浏览器，而在"第二条流要重新缓冲一遍"。）
//   现在 ffmpeg 在服务端直接从 URL 抽帧，浏览器不需要实时缓冲任何东西。
//   抽好的帧会缓存在任务目录，同一任务重看不再重复抽。
function captureFrames(box, taskId){
  const strip=box.querySelector('#frames-'+taskId);
  if(!strip || !taskId) return;
  strip.innerHTML='<div class="notice muted" style="grid-column:1/-1;margin-top:.35rem">'
    +'<span class="n-ico">⏳</span><div>视频截图中…（服务端抽帧，首次约 10~40 秒）</div></div>';
  const cover=strip.dataset.cover||'';
  const tick=window.MEDIA_TICK?'&v='+window.MEDIA_TICK:'';
  const N=5;
  const srcOf=i=>API+'/media/frame?taskId='+encodeURIComponent(taskId)+'&i='+i+'&n='+N+tick;
  const fail=(why)=>{
    if(!strip.isConnected) return;
    const card=strip.closest('.card');
    const hasRefresh=!!(card && card.querySelector('[data-refresh-media]'));
    strip.innerHTML='<div class="notice warn" style="grid-column:1/-1;margin-top:.35rem">'
      +'<span class="n-ico">⚠️</span><div>'
      +'<b>视频截图没取到</b>'+(why?('（'+escapeHtml(why)+'）'):'')
      +'<br>'+(hasRefresh
        ? '服务端直接从视频源抽帧也没成功，通常是这条直链已过期或被限速：点上方「<b>刷新直链</b>」换一组地址后再试（不用重新转写）。'
        : '服务端直接从视频源抽帧没成功：本地文件可能已被移动/删除，或该视频的编码 ffmpeg 解不出画面。重新导入一次原文件即可。')
      +'</div></div>'
      +(cover?'<img class="cover" src="'+cover+'" alt="封面" onerror="this.style.display=\'none\'" style="grid-column:1/-1;margin-top:.4rem">':'');
  };
  strip.innerHTML=Array.from({length:N},(_,i)=>
    '<img src="'+srcOf(i)+'" alt="视频截图 '+(i+1)+'">').join('');
  const els=Array.from(strip.querySelectorAll('img'));
  let failed=0;
  els.forEach(el=>{
    el.onerror=()=>{
      failed++; el.style.display='none';
      if(failed>=els.length) fail('全部取帧失败');
    };
  });
}

// ---------- 截图预览：悬停浮空放大 + 点击灯箱 ----------
function framePeekEl(){
  let el=document.getElementById('framePeek');
  if(!el){
    el=document.createElement('div');
    el.id='framePeek';
    el.innerHTML='<img alt="">';
    document.body.appendChild(el);
  }
  return el;
}

function showFramePeek(thumb){
  const src=thumb.currentSrc||thumb.src;
  if(!src) return;
  const box=framePeekEl(), pic=box.querySelector('img');
  pic.src=src;
  const nw=thumb.naturalWidth||480, nh=thumb.naturalHeight||270;
  const vw=window.innerWidth, vh=window.innerHeight;
  let w=Math.min(560, Math.max(320, vw*0.45));
  let h=w*nh/nw;
  const maxH=vh*0.7;
  if(h>maxH){ h=maxH; w=h*nw/nh; }
  pic.style.width=Math.round(w)+'px';
  pic.style.height=Math.round(h)+'px';
  const r=thumb.getBoundingClientRect();
  const left=Math.max(8, Math.min(r.left+r.width/2-w/2, vw-w-8));
  let top=r.top-h-10;
  if(top<8) top=Math.min(r.bottom+10, vh-h-8);
  box.style.left=Math.round(left)+'px';
  box.style.top=Math.round(top)+'px';
  box.style.opacity='1';
}

function hideFramePeek(){
  const el=document.getElementById('framePeek');
  if(el) el.style.opacity='0';
}

function closeFrameLightbox(){
  const lb=document.getElementById('frameLightbox');
  if(lb) lb.classList.remove('open');
  document.body.style.overflow='';
}

function openFrameLightbox(src){
  if(!src) return;
  let lb=document.getElementById('frameLightbox');
  if(!lb){
    lb=document.createElement('div');
    lb.id='frameLightbox';
    lb.innerHTML='<img alt="视频截图">';
    lb.addEventListener('click', closeFrameLightbox);
    lb.querySelector('img').addEventListener('click', e=>e.stopPropagation());
    document.body.appendChild(lb);
  }
  lb.querySelector('img').src=src;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
  hideFramePeek();
}

if(!window.__framePreviewBound){
  window.__framePreviewBound=true;
  document.addEventListener('mouseover', e=>{
    const img=e.target.closest('.frame-strip img');
    if(img) showFramePeek(img);
  });
  document.addEventListener('mouseout', e=>{
    const img=e.target.closest('.frame-strip img');
    if(img && !img.contains(e.relatedTarget)) hideFramePeek();
  });
  document.addEventListener('click', e=>{
    const img=e.target.closest('.frame-strip img');
    if(img){ e.preventDefault(); openFrameLightbox(img.src); }
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ closeFrameLightbox(); hideFramePeek(); }
  });
  window.addEventListener('scroll', hideFramePeek, true);
}

/* ---------- 简/繁切换（默认简体） ---------- */
async function convertVariant(text, to){
  try{
    const r=await fetch(API+'/text/convert',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text,to:to})});
    const j=await r.json();
    return (j && j.data && j.data.text) || text;
  }catch(e){ return text; }
}

function initTranscriptVariant(box){
  const el=box.querySelector('.transcript[data-copy-src="txt"]');
  const sw=box.querySelector('[data-variant-switch]');
  if(!el || !sw) return;
  // 作者文案 / 画面文字两段也跟随简/繁切换（之前只转口播正文，用户会以为切换失效）
  const nodes=[el, ...box.querySelectorAll('.transcript[data-variant-ocr]')];
  // 原文只保留一次（已有就复用，快照恢复场景不要覆盖）
  nodes.forEach(n=>{ if(!n.dataset.original) n.dataset.original = n.textContent; });

  const setActive=(v)=>sw.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.variant===v));
  const apply=async(v)=>{
    setActive(v);
    const cacheKey = (v==='t') ? 't' : 's';
    await Promise.all(nodes.map(async n=>{
      if(!n.dataset[cacheKey]){
        n.dataset[cacheKey] = await convertVariant(n.dataset.original, cacheKey);
      }
      n.textContent = n.dataset[cacheKey];
    }));
  };
  sw.addEventListener('click', e=>{
    const b=e.target.closest('[data-variant]'); if(!b) return;
    apply(b.dataset.variant);
  });
  apply('s');   // 默认简体
}

// ---------- 导航 & 渲染控制 ----------
let currentView='home', currentKey='';

// ---------- 结果区快照 ----------
// 问题：showView() 切视图会整块重渲染 view，导致"提取完 → 点历史记录 → 切回来"时
//       结果卡（含视频预览/导出/AI 按钮）全部消失，只剩空表单。
// 方案：离开前把当前视图的结果容器 HTML 存快照（按 视图+平台key 区分），
//       切回同一视图时原样还原。按钮都走 document 级事件委托，还原后无需重新绑定。
const RESULT_CONTAINERS = { video:['vresult'], batch:['bresult'], image:['iresult'], file:['fresult'] };
let resultSnap = null;

function snapshotResult(){
  const ids = RESULT_CONTAINERS[currentView];
  if(!ids) return;
  const snap = {}; let has = false;
  ids.forEach(id=>{
    const el = document.getElementById(id);
    if(el && el.innerHTML.trim()){ snap[id] = el.innerHTML; has = true; }
  });
  resultSnap = has ? { view: currentView, key: currentKey||'', snap } : null;
}

function restoreResult(viewId, key){
  if(!resultSnap || resultSnap.view !== viewId || resultSnap.key !== (key||'')) return;
  Object.entries(resultSnap.snap).forEach(([id, html])=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = html;
    // innerHTML 恢复不会带回直接绑定的监听器，简/繁开关要重新初始化
    if(el.dataset && el.dataset.stack !== undefined){
      el.querySelectorAll(':scope > .card').forEach(card=>{
        if(card.querySelector('[data-variant-switch]')) initTranscriptVariant(card);
      });
    }else if(el.querySelector('[data-variant-switch]')) initTranscriptVariant(el);
    // 离开时截图还没生成完 → 回来补一次
    el.querySelectorAll('.frame-strip').forEach(s=>{
      if(s.dataset.task && !s.querySelector('img')) captureFrames(el, s.dataset.task);
    });
  });
  refreshQqResultTabs();
}

const $=s=>document.querySelector(s);

function applyKeyOnActive(section){
  const items = document.querySelectorAll('.dd-item');
  items.forEach(el=>{ el.classList.toggle('active', el.dataset.navTo===section); });
}

function showView(id, key='', pushState=false){
  const fromTaskUrl=/[?&]task=/.test(location.hash);
  closeExportModal();        // 2026-11-05：切页时收起导出弹窗，别把遮罩留在新页面上
  closeFrameLightbox();
  hideFramePeek();
  stopBiliPlayer();
  snapshotResult();          // 离开前保存当前结果区（防止切走即丢失）
  currentView=id; currentKey=key;
  // 顶部导航高亮
  document.querySelectorAll('[data-nav]').forEach(n=>n.classList.remove('active'));
  const homeNav=document.querySelector('[data-nav="home"]');
  const extractNav=document.getElementById('extractLink');
  const histNav=document.querySelector('[data-nav="history"]');
  const discNav=document.querySelector('[data-nav="discover"]');
  if(id==='home'){ homeNav&&homeNav.classList.add('active'); }
  else if(id==='history'){ histNav&&histNav.classList.add('active'); }
  else if(id==='discover'){ discNav&&discNav.classList.add('active'); }
  else { extractNav&&extractNav.classList.add('active'); }
  // 渲染
  const v=document.getElementById('view-'+id);
  v.className='view active'+(key?'':' ');
  v.innerHTML=views[id](key, );
  const container=document.querySelector('.container');
  if(container) container.classList.toggle('qq-wide', id==='video' && key==='qqvideo');
  // 切走后把别的视图里的播放器停掉并摘掉 src：只隐藏不清理的话，
  // <video> 会继续在后台拉流/出声，截帧条也会留在 DOM 里（抖音的画面就"跟着"跑到别的页面了）
  document.querySelectorAll('.view').forEach(x=>{
    if(x===v) return;
    x.className='view';
    x.querySelectorAll('video').forEach(m=>{
      try{ m.pause(); m.removeAttribute('src'); m.load(); }catch(e){}
    });
  });
  // 事件绑定
  bindViewEvents();
  // 还原上次的提取结果（同一视图+同一平台才还原）
  restoreResult(id, key);
  // 回到有进行中任务的页面：恢复进度并继续轮询（带 ?task= 的历史结果页不抢）
  if(!fromTaskUrl) resumeActive(id, key);
  // 顶部提醒条跟着当前页面走：已经在进度页就不再提示
  renderActiveBanner();
  // 历史视图加载数据
  if(id==='history' && window.loadHistory) window.loadHistory();
  // 账号页加载登录状态
  if(id==='accounts' && window.loadAccounts) window.loadAccounts();
  // 设置页加载配置
  if(id==='settings' && window.loadSettings) window.loadSettings();
  // 同步 URL 与标签页标题（replaceState 不触发 hashchange，不会造成循环渲染）
  const wantHash = '#/' + id + (key ? '/' + key : '');
  if (location.hash !== wantHash) {
    try {
      // 顶部导航/站内跳转用 pushState，浏览器后退才能回到上一视图（并还原结果）
      if (pushState) history.pushState(null, '', wantHash);
      else history.replaceState(null, '', wantHash);
    } catch(e) {}
  }
  setPageTitle(id, key);
  window.scrollTo({top:0});
}

// 拖拽上传
function bindDropzone(dzSel, inputSel, onFile, helper){
  const dz=document.querySelector((dzSel||'').startsWith('#')?dzSel:'#'+dzSel);
  if(!dz) return;
  const inp=document.querySelector((inputSel||'').startsWith('#')?inputSel:'#'+inputSel);
  if(inp){
    inp.addEventListener('change',()=>{ if(inp.files[0] && onFile) onFile(inp.files[0]); });
    dz.addEventListener('click',()=>inp.click());
  }
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
  dz.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f&&onFile) onFile(f); });
}

function copyText(t){ return navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject(); }
let toastTimer=null;
function toast(msg){ const m=$('#vmsg')||$('#bmsg')||$('#imsg')||$('#fmsg'); if(m){ m.className='msg success show'; m.textContent=msg; clearTimeout(toastTimer); toastTimer=setTimeout(()=>m.className='msg',1800);} }

// ---------- 提取逻辑 ----------
async function api(path, opt={}){
  // GET 幂等 → 网络抖动时自动重试两次；POST/PUT 不重试（避免重复建任务）
  const method=(opt.method||'GET').toUpperCase();
  const retries = method==='GET' ? 2 : 0;
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(API+path, Object.assign({headers:{'Content-Type':'application/json'}}, opt));
      return await r.json();
    }catch(e){
      lastErr=e;
      if(i<retries) await new Promise(res=>setTimeout(res, 500*(i+1)));
    }
  }
  throw lastErr;
}

// ---------- 进行中任务：切视图 / 刷新 / **关掉页面重开** 后仍能继续 ----------
// 2026-11-05 改：原来存 sessionStorage（仅本标签页，关掉就丢），用户重开页面
// 找不到正在提取的界面，只能去历史记录翻。改存 localStorage，并在页面启动时
// 用 /transcript/active 从服务端补一份（换标签页/清过浏览器数据也能找回）。
const ACTIVE_STORE='transcript_active_tasks_v1';
const TASK_UI={
  video:{load:'#vload', txt:'#vloadtxt', btn:'#vbtn', msg:'#vmsg', result:'#vresult', running:'正在提取', ok:'✓ 提取成功'},
  file:{load:'#fload', txt:'#floadtxt', btn:'#fbtn', msg:'#fmsg', result:'#fresult', running:'正在转写', ok:'✓ 转写完成'},
};
let activeTasks={};
try{ activeTasks=JSON.parse(localStorage.getItem(ACTIVE_STORE)||'{}')||{}; }catch(e){ activeTasks={}; }
// 迁移旧版存在 sessionStorage 的入口：同一次升级里不丢正在提取的任务
try{
  const legacy=JSON.parse(sessionStorage.getItem(ACTIVE_STORE)||'{}')||{};
  Object.keys(legacy).forEach(k=>{ if(!activeTasks[k]) activeTasks[k]=legacy[k]; });
}catch(e){}
const taskPollers=new Set();

function saveActive(){ try{ localStorage.setItem(ACTIVE_STORE, JSON.stringify(activeTasks)); }catch(e){} }
const PLATFORM_VIEW_KEYS={'抖音':'douyin','小红书':'xhs','快手':'kuaishou','B站':'bilibili','视频号':'qqvideo'};
// 服务端任务 → 前端入口（view/key 决定它显示在哪一页，kind 决定用哪套 loading/结果区）
function entryFromServer(t){
  const isChannel=t.platform==='视频号';
  if(t.taskType==='file_transcript' && !isChannel)
    return {taskId:t.taskId, view:'file', key:'video', kind:'file', done:false, status:t.status, message:t.errorMessage||'处理中'};
  return {taskId:t.taskId, view:'video', key:PLATFORM_VIEW_KEYS[t.platform]||'douyin',
          kind:'video', done:false, status:t.status, message:t.errorMessage||'处理中'};
}
// 顶部「有任务正在处理中」条：只提醒不在当前页的那些，点一下就到进度所在的页面
function renderActiveBanner(){
  const el=document.getElementById('activeBanner'); if(!el) return;
  const others=Object.values(activeTasks).filter(e=>!e.done &&
    !(e.view===currentView && (e.key||'')===(currentKey||'')));
  if(!others.length){ el.style.display='none'; el.innerHTML=''; return; }
  const e=others[0];
  const label={video:'视频文案提取', file:'文件转写', batch:'批量提取'}[e.view]||'任务';
  el.innerHTML='⏳ 有 '+others.length+' 个任务还在处理中（'+escapeHtml(label)+'）'
    +' <a data-active-goto="'+escapeHtml(activeKey(e.view,e.key))+'">查看进度 ›</a>';
  el.style.display='block';
}
// 页面启动时从服务端补齐进行中任务（本地 storage 只覆盖"同一浏览器"这一种情况）
async function syncActiveFromServer(){
  let j;
  try{ j=await api('/transcript/active'); }catch(e){ return; }
  const d=(j&&j.data)||{}; const list=d.tasks||[];
  const known=new Set(Object.values(activeTasks).map(e=>e.taskId));
  let added=false;
  list.forEach(t=>{
    if(!t.taskId || known.has(t.taskId)) return;
    const e=entryFromServer(t);
    activeTasks[activeKey(e.view,e.key)]=e; added=true;
  });
  (d.batches||[]).forEach(b=>{
    if(!b.batchId || known.has(b.batchId)) return;
    activeTasks[activeKey('batch','')]={taskId:b.batchId, view:'batch', key:'',
      kind:'batch', done:false, status:'RUNNING', message:'进行中'};
    added=true;
  });
  if(added) saveActive();
  renderActiveBanner();
  // 当前页正好有进行中的任务 → 把进度续上（批量也走这里，进入页面才会轮询）
  const cur=activeTasks[activeKey(currentView,currentKey)];
  if(cur && !cur.done) resumeActive(currentView, currentKey);
}
// 点顶部提醒条 → 跳到对应页面（进度会在 showView 里自动续上）
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-active-goto]'); if(!a) return;
  e.preventDefault();
  const entry=activeTasks[a.dataset.activeGoto];
  if(!entry) return;
  const want='#/'+entry.view+(entry.key?'/'+entry.key:'');
  if(location.hash===want) resumeActive(entry.view, entry.key);
  else location.hash=want;
});
function activeKey(view,key){ return view+'|'+(key||''); }
function isCurrent(entry){ return currentView===entry.view && currentKey===(entry.key||''); }
function taskUi(kind){
  const cfg=TASK_UI[kind]||{};
  const q=sel=>sel?document.querySelector(sel):null;
  return {cfg, load:q(cfg.load), txt:q(cfg.txt), btn:q(cfg.btn), msg:q(cfg.msg), result:q(cfg.result)};
}
function setTaskLoading(entry,text){
  const ui=taskUi(entry.kind);
  if(ui.load) ui.load.className='loading show';
  if(ui.txt && text) ui.txt.textContent=text;
  if(ui.btn) ui.btn.disabled=true;
}
function clearTaskLoading(entry){
  const ui=taskUi(entry.kind);
  if(ui.load) ui.load.className='loading';
  if(ui.btn) ui.btn.disabled=false;
}
function clearTaskParam(){
  if(/[?&]task=/.test(location.hash)){
    try{ history.replaceState(null,'',location.hash.split('?')[0]); }catch(e){}
  }
}
function registerActive(entry){
  activeTasks[activeKey(entry.view,entry.key)]=entry;
  saveActive();
  renderActiveBanner();
}
function removeActive(entry){
  const k=activeKey(entry.view,entry.key);
  if(activeTasks[k] && activeTasks[k].taskId===entry.taskId){ delete activeTasks[k]; saveActive(); }
  renderActiveBanner();
}
function showTaskSuccess(entry,d){
  if(!isCurrent(entry)) return;
  const ui=taskUi(entry.kind);
  if(ui.result) renderVideoResult(d, ui.result);
  // 2026-11-05 用户要求「必须视频呈现在界面上才算成功」：视频号的链接模式卡片只有文案，
  // 不能再挂绿色「✓ 提取成功」——用琥珀色如实说明缺的是视频。
  if(entry.kind==='video' && d.taskType==='videochannel'){
    if(ui.msg){ ui.msg.className='msg warn show';
      ui.msg.textContent='只拿到文案，没有视频（未绑定凭证或该作品本身无视频流）。要视频：绑定凭证后重新提取。'; }
  } else if(ui.msg){
    ui.msg.className='msg success show'; ui.msg.textContent=ui.cfg.ok||'✓ 完成';
  }
  clearTaskLoading(entry);
  snapshotResult();
  try{ history.replaceState(null,'',resultUrlFor(entry.view, entry.key, entry.taskId)); }catch(e){}
  if(ui.result) ui.result.scrollIntoView({behavior:'smooth'});
  removeActive(entry);
}
function showTaskFailure(entry,msg){
  if(!isCurrent(entry)) return;
  const ui=taskUi(entry.kind);
  clearTaskLoading(entry);
  if(ui.msg){
    ui.msg.className='msg error show';
    if((msg||'').includes('再点一次「提取」')){
      // 2026-11-05：视频号直链抖动——文案已取到，只差视频。给一键重试，不用回去找输入框
      ui.msg.innerHTML=escapeHtml('失败：'+(msg||'未知错误'))
        +' <button type="button" class="btn sm" data-qq-retry>再提取一次</button>';
    }else{
      ui.msg.textContent='失败：'+(msg||'未知错误');
    }
  }
  removeActive(entry);
  loadRiskStatus();
}
function pollTaskEntry(entry){
  if(taskPollers.has(entry.taskId)) return;
  taskPollers.add(entry.taskId);
  const k=activeKey(entry.view,entry.key);
  const tick=()=>{
    if(activeTasks[k]?.taskId!==entry.taskId){ taskPollers.delete(entry.taskId); return; }
    api('/transcript/queryTask?taskId='+encodeURIComponent(entry.taskId)).then(j=>{
      if(activeTasks[k]?.taskId!==entry.taskId){ taskPollers.delete(entry.taskId); return; }
      const d=j.data; if(!d) throw new Error('无数据');
      if(d.status==='SUCCESS'){
        entry.done=true; entry.status='SUCCESS'; saveActive();
        taskPollers.delete(entry.taskId);
        if(isCurrent(entry)) showTaskSuccess(entry,d);
      } else if(d.status==='FAILURE'){
        entry.done=true; entry.status='FAILURE'; entry.message=d.errorMessage||'任务失败'; saveActive();
        taskPollers.delete(entry.taskId);
        if(isCurrent(entry)) showTaskFailure(entry, entry.message);
      } else {
        entry.message=d.errorMessage||'处理中'; saveActive();
        if(isCurrent(entry)) setTaskLoading(entry, (TASK_UI[entry.kind].running||'处理中')+'：'+entry.message+'...');
        setTimeout(tick, 2000);
      }
    }).catch(e=>{
      // 网络抖动 / 服务重启：**不要立刻判定任务失败**。
      // 任务可能还在后台跑，或者已经跑完进了历史记录（2026-11-03 实测踩到：
      // 重启服务时前端两个请求同时失败，界面直接显示 "Failed to fetch"，
      // 但任务其实成功了）。先重试几次再走历史兜底。
      entry._netErrs=(entry._netErrs||0)+1;
      if(entry._netErrs<=3){
        if(isCurrent(entry)) setTaskLoading(entry, '与服务的连接中断，重试中…');
        setTimeout(tick, 2500 + entry._netErrs*1500);
        return;
      }
      taskPollers.delete(entry.taskId);
      // 服务重启后内存任务会丢 → 试历史记录（已完成的任务仍能恢复）
      api('/history/detail?taskId='+encodeURIComponent(entry.taskId)).then(h=>{
        const d=h.data;
        if(d && d.status==='SUCCESS'){ entry.done=true; entry.status='SUCCESS'; saveActive(); if(isCurrent(entry)) showTaskSuccess(entry, historyToResult(d)); }
        else if(d){ entry.done=true; entry.status='FAILURE'; saveActive(); if(isCurrent(entry)) showTaskFailure(entry, d.error_msg||'任务失败'); }
        else if(isCurrent(entry)) showTaskFailure(entry, '连接中断，且历史里没有这个任务 —— 请到「历史记录」确认');
      }).catch(()=>{ if(isCurrent(entry)) showTaskFailure(entry, '连接中断，请到「历史记录」确认任务是否已完成'); });
    });
  };
  setTimeout(tick, 500);
}
function resumeActive(view,key){
  const entry=activeTasks[activeKey(view,key)];
  if(!entry) return;
  if(entry.kind==='batch'){ resumeBatchEntry(entry); return; }
  if(!entry.done){
    setTaskLoading(entry, (TASK_UI[entry.kind].running||'处理中')+'：'+(entry.message||'处理中')+'...');
    pollTaskEntry(entry);
    return;
  }
  api('/transcript/queryTask?taskId='+encodeURIComponent(entry.taskId)).then(j=>j.data).catch(()=>null).then(d=>{
    if(d && d.status==='SUCCESS') return showTaskSuccess(entry,d);
    if(d && d.status==='FAILURE') return showTaskFailure(entry, d.errorMessage||'任务失败');
    if(d){ entry.done=false; saveActive(); setTaskLoading(entry, (TASK_UI[entry.kind].running||'处理中')+'...'); pollTaskEntry(entry); return; }
    return api('/history/detail?taskId='+encodeURIComponent(entry.taskId)).then(h=>h.data).then(hd=>{
      if(hd && hd.status==='SUCCESS') return showTaskSuccess(entry, historyToResult(hd));
      if(hd) return showTaskFailure(entry, hd.error_msg||'任务失败');
      showTaskFailure(entry, '任务已不存在');
    }).catch(()=>showTaskFailure(entry, '任务已不存在'));
  });
}

async function videoExtract(){
  const url=($('#vurl').value||'').trim(); const m=$('#vmsg');
  if(!url){ m.className='msg error show'; m.textContent='请粘贴视频链接'; return; }
  clearTaskParam();
  m.className='msg';
  setTaskLoading({kind:'video'}, '正在提取...');
  const vresult=$('#vresult');
  if(vresult && vresult.dataset.stack === undefined) vresult.innerHTML='';
  syncQqEmptyState();   // 清空后视频号页收回单栏（避免右侧留一块空白）
  try{
    const j=await api('/transcript/doTask',{method:'POST',body:JSON.stringify({appType:'douchong',workUrl:url,type:'text',targetLanguage:'auto',whisperModel:$('#vwhisper').value,ocrFrames:!!(document.getElementById('vframes')||{}).checked})});
    if(j.code!==200||!j.data){ throw new Error(j.msg||'创建失败'); }
    const entry={taskId:j.data.taskId, view:'video', key:currentKey, kind:'video', done:false, status:'RUNNING', message:'排队中'};

function dsEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function dsDur(sec){
  var n=Number(sec)||0; if(n<=0) return '时长未知';
  var m=Math.floor(n/60), s=Math.floor(n%60);
  return m ? (m+':'+String(s).padStart(2,'0')) : (s+' 秒');
}
function dsPlay(n){
  n=Number(n)||0;
  if(n>=100000000) return (n/100000000).toFixed(1)+' 亿';
  if(n>=10000) return (n/10000).toFixed(1)+' 万';
  return String(n);
}
function dsMsg(id, text, bad){
  var el=document.getElementById(id); if(!el) return;
  el.className = bad ? 'msg error show' : 'msg show';
  el.textContent = text || '';
}

function dcText(){
  var d=window.__dcMeta || {};
  var cs=window.__dcData || [];
  if(!cs.length) return '';
  var out='# 抖音一级评论 '+ (d.url||'') +'\n';
  out += '# 总数 '+ (d.total||'?') +' 条，本文件 '+ cs.length +' 条（采集于访客态）\n\n';
  out += cs.map(function(c,i){
    return (i+1)+'. '+(c.nickname||'匿名')+(c.ip?('（'+c.ip+'）'):'')+' · 赞 '+c.digg+'\n'+c.text+'\n';
  }).join('\n');
  return out;
}

function discoverCopyComments(){
  var txt=dcText();
  if(!txt){ notify('还没有可复制的评论','error'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ notify('已复制 '+window.__dcData.length+' 条评论','success'); },
      function(){ notify('复制失败，请改用下载 txt','error'); });
  }else{
    notify('当前浏览器不支持剪贴板，请用下载 txt','error');
  }
}

function discoverDownloadTxt(){
  var txt=dcText();
  if(!txt){ notify('还没有可下载的评论','error'); return; }
  var meta=window.__dcMeta || {};
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='douyin_comments_'+(meta.awemeId||Date.now())+'.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}

function resumeBatchEntry(entry){
  if(!entry.done){ const btn=document.querySelector('#bbtn'); if(btn) btn.disabled=true; }
  pollBatchEntry(entry);
}

function pollBatchEntry(entry){
  if(taskPollers.has(entry.taskId)) return;
  taskPollers.add(entry.taskId);
  const k=activeKey(entry.view,entry.key);
  const tick=()=>{
    if(activeTasks[k]?.taskId!==entry.taskId){ taskPollers.delete(entry.taskId); return; }
    api('/transcript/batch/queryTask?batchId='+encodeURIComponent(entry.taskId)).then(j=>{
      if(activeTasks[k]?.taskId!==entry.taskId){ taskPollers.delete(entry.taskId); return; }
      const d=j.data; if(!d) throw new Error('无数据');
      if(currentView==='batch'){
        const out=$('#bresult'); if(out) out.innerHTML=renderBatchResult(d.items);
      }
      if(d.status!=='SUCCESS'){
        entry.message='进行中'; saveActive();
        const btn=document.querySelector('#bbtn'); if(btn && currentView==='batch') btn.disabled=true;
        setTimeout(tick, 2000);
      } else {
        entry.done=true; entry.status='SUCCESS'; saveActive();
        taskPollers.delete(entry.taskId);
        if(currentView==='batch'){
          const m=$('#bmsg'); if(m){ m.className='msg success show'; m.textContent='✓ 批量提取完成，成功 '+d.success+' / 共 '+d.total+' 条'; }
          const btn=$('#bbtn'); if(btn) btn.disabled=false;
          removeActive(entry);
        }
      }
    }).catch(e=>{ taskPollers.delete(entry.taskId); if(currentView==='batch'){ const m=$('#bmsg'); if(m){ m.className='msg error show'; m.textContent='轮询出错: '+e.message; } const btn=$('#bbtn'); if(btn) btn.disabled=false; } });
  };
  setTimeout(tick, 400);
}

  let h='';
  const keys=Object.keys(d);
  // 视频号扫码授权（贴链接直接下载换凭证用）固定排第一，其它平台保持后端顺序
  keys.sort((a,b)=>(a==='yuanbao'?-1:(b==='yuanbao'?1:0)));
  keys.forEach(key=>{
    const p=d[key]||{}; const rows=p.accounts||[];

      +'<span class="muted" style="font-size:.78rem">'
      +(p.logged_in_count?('已登录 '+p.logged_in_count+' 个'):'未登录')
      +(p.note?(' · '+escapeHtml(key==='yuanbao'?'元宝登录：微信扫码一次，有效期约 2 个月':p.note)):'')+'</span>'
      +'<button class="btn sm ghost" data-login="'+key+'|">登录默认账号</button>'
      +'<button class="btn sm ghost" data-login="'+key+'|account_'+(others+1)+'">+ 新账号 account_'+(others+1)+'</button>'
      +'</div>';
    rows.forEach(a=>{
      const acct=(a.account==='（默认）')?'':a.account;
      h+='<div style="display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;font-size:.82rem;padding:.4rem 0;border-top:1px dashed var(--border)">'
        +'<span style="min-width:7.5rem">'+escapeHtml(a.account)+'</span>'
        +(a.logging_in? '<span style="color:#b45309">登录中…（请到浏览器窗口完成）</span>'
          : a.logged_in? '<span style="color:#047857">● 已登录</span><span class="muted">'+escapeHtml(a.logged_at||'')+'（'+escapeHtml(a.ago||((a.days_ago||0)+' 天前'))+'）</span>'
          : '<span class="muted">○ 未登录</span>')
        // 凭证真实到期日：从 cookie 文件读，不写死文案（用户 2026-11-05 指出「长期有效」不实）
        +((a.logged_in && a.expires_at)? '<span style="color:'+(a.expiring?'#b91c1c':'var(--muted)')+'" title="登录凭证到 '+escapeHtml(a.expires_at)+' 过期，到期后重扫一次即可">· 有效至 '+escapeHtml(a.expires_at.slice(0,10))+'（剩 '+(a.days_left!=null?a.days_left:'?')+' 天）</span>':'')
        +(a.cooldown? '<span style="color:#b45309">· 冷却中 '+Math.ceil(a.cooldown/60)+' 分钟</span>':'')
        // 出口：配代理池后最该确认的一件事——这个号到底走哪条 IP
        +'<span style="color:'+(a.egress?'#0369a1':'var(--muted)')+'" title="'+(a.egress?'该号稳定绑定这条出口':'没有可用出口，走本机直连')+'">· 出口 '+escapeHtml(a.egress_label||'直连')+'</span>'
        // 健康度：池内号才用得上（默认账号不参与轮换，没有这些计数）
        +((a.ok||a.fail)? '<span class="muted" title="累计成功/失败（跨天不重置）">· 成功 '+a.ok+' / 失败 '+a.fail+((a.success_rate!=null)?'（'+Math.round(a.success_rate*100)+'%）':'')+'</span>':'')

        +((a.last_fail)? '<span class="muted" title="'+escapeHtml(String(a.last_fail))+'" style="cursor:help">· 最近失败 ⓘ</span>':'')

  const rf=document.getElementById('acctRefresh'); if(rf) rf.onclick=()=>window.loadAccounts();
  // 出口自检：逐个探测已配置的出口，配完代理立刻知道通不通（不用拿任务试错）
  const pc=document.getElementById('acctProxyCheck');
  if(pc) pc.onclick=async function(){
    const msg=document.getElementById('acctProxyMsg');
    pc.disabled=true; msg.style.color='var(--muted)'; msg.textContent=' 正在逐个探测（每个出口约 2 秒）…';
    try{
      const j=await api('/proxy/check',{method:'POST'});
      const dd=(j&&j.data)||{};
      const parts=Object.keys(dd).map(k=>{
        const v=dd[k]||{};
        return k+(v.ok?' ✓通':' ✗'+(v.detail||'不通'));
      });
      msg.style.color=((j&&j.code===200)&&parts.every(p=>p.indexOf('✓')>=0))?'#047857':'#b91c1c';
      msg.textContent=' '+(j&&j.msg?j.msg:'')+(parts.length?(' — '+parts.join(' | ')):'');
    }catch(e){ msg.style.color='#b91c1c'; msg.textContent=' 自检失败：'+(e.message||e); }
    finally{ pc.disabled=false; }
  };
};

async function accountLogin(spec){
  const [platform,account]=String(spec).split('|');
  notify('正在打开登录窗口…');
  try{
    const j=await api('/login/start',{method:'POST',body:JSON.stringify({platform:platform,account:account||''})});
    notify(j.msg||'已打开登录窗口', j.code===200?'success':'error');

  let n=0; const t=setInterval(()=>{ n++; window.loadAccounts(); if(n>=60) clearInterval(t); }, 5000);

async function accountLogout(spec){
  const [platform,account]=String(spec).split('|');
  const who = account || '默认账号';
  if(!confirm('退出「'+who+'」的登录？\n\n'
    +'会删除：该号的登录 cookie + 它专用的浏览器 profile\n'
    +'（被平台标记过的浏览器身份也一并清掉）\n\n'
    +'历史记录和已提取的文案不受影响，重新登录即可恢复。')) return;

// ---------- 初始化 ----------
async function loadRiskStatus(){
  const el=document.getElementById('riskBanner');
  if(!el) return;
  try{
    const j=await (await fetch(API+'/risk/status')).json();
    const d=j.data||{};
    const alerts=j.alerts||[];
    const items=[]; let anyCool=false;
    alerts.forEach(a=>{
      if(!a || !a.message) return;
      if(a.level==='danger') anyCool=true;
      items.push((a.level==='info'?'':'⚠ ')+escapeHtml(String(a.message)));
    });
    Object.values(d).forEach(x=>{
      if(!x || !x.enabled) return;
      const remain=Number(x.cooldownRemaining||0);
      const pending=Number((x.queue&&x.queue.pending)||0);
      if(remain>0){
        anyCool=true;
        const mins=Math.max(1, Math.ceil(remain/60));
        const why=x.reason?'（'+escapeHtml(String(x.reason).slice(0,20))+'）':'';
        items.push(escapeHtml(x.label)+'冷却中，约 '+mins+' 分钟'+why);
      }else if(pending>0){
        items.push(escapeHtml(x.label)+'排队 '+pending+' 条');
      }
    });
    if(!items.length){ el.style.display='none'; el.textContent=''; return; }
    const prefix = alerts.length ? '' : (anyCool?'风控提示：':'队列：');
    el.textContent=prefix+items.join('；')
      +(anyCool?'。期间请求会快速失败，建议先提取其他平台。':'。');
    el.classList.toggle('alert-danger', alerts.some(a=>a&&a.level==='danger'));
    el.style.display='block';
  }catch(e){ el.style.display='none'; }
}

function init(){
  // 先查 AI 纠错是否可用（决定按钮是否显示）
  loadAiStatus();
  loadRiskStatus();
  setInterval(loadRiskStatus, 30000);
  buildMenu();
  // 下拉开关
  document.getElementById('extractLink').addEventListener('click', e=>{ e.stopPropagation(); document.getElementById('extractPanel').classList.toggle('open'); });
  document.addEventListener('click', e=>{ if(!e.target.closest('.dropdown')) document.getElementById('extractPanel').classList.remove('open'); });
  // 画面文字 OCR：**默认不勾选**（2026-11-03 按需求改）。
  // 它会抽帧跑 OCR，明显拖慢速度，而且大多数视频并不需要；改成按需手动开。
  // 用户手动改过（change）之后依然不会被覆盖。
  document.addEventListener('change', e=>{
    if(e.target && e.target.id==='vframes') e.target.dataset.touched='1';
  });
  document.addEventListener('input', e=>{
    if(!e.target || e.target.id!=='vurl') return;
    const box=document.getElementById('vframes');
    if(!box || box.dataset.touched) return;
    box.checked=false;
  });
  // 悬停说明气泡：任何带 data-tip 的元素都能用（说明挂在按钮本身上，不额外加按钮）
  (function bindTips(){
    let tip=null;
    const ensure=()=>{
      if(tip) return tip;
      tip=document.createElement('div');
      tip.style.cssText='position:fixed;z-index:400;max-width:320px;background:#fff;color:#1b1b2f;'
        +'border:1px solid var(--border);padding:.55rem .72rem;border-radius:10px;font-size:.78rem;'
        +'line-height:1.6;white-space:pre-line;box-shadow:0 10px 26px rgba(31,27,47,.12);opacity:0;'
        +'transition:opacity .12s;pointer-events:none;';
      document.body.appendChild(tip);
      return tip;
    };
    const show=(el)=>{
      const text=el.dataset.tip||''; if(!text) return;
      const t=ensure(); t.textContent=text;
      const r=el.getBoundingClientRect();
      t.style.left='0px'; t.style.top='0px'; t.style.opacity='1';
      const w=t.offsetWidth, h=t.offsetHeight;
      let left=Math.min(Math.max(8, r.right-w), Math.max(8, window.innerWidth-w-8));
      let top=r.bottom+8;
      if(top+h > window.innerHeight-8) top=Math.max(8, r.top-8-h);   // 下方放不下就放到上方
      t.style.left=left+'px'; t.style.top=top+'px';
    };
    const hide=()=>{ if(tip) tip.style.opacity='0'; };
    document.addEventListener('mouseover', e=>{ const el=e.target.closest('[data-tip]'); if(el) show(el); });
    document.addEventListener('mouseout', e=>{ if(e.target.closest('[data-tip]')) hide(); });
    document.addEventListener('click', hide, true);
    window.addEventListener('scroll', hide, true);
  })();
  // 「再提取一次」按钮（视频号"文案有了、视频没拿到"的失败提示里按需出现）：
  // 直接复用主按钮，账号/输入框状态全都保持原样
  document.addEventListener('click', e=>{
    const b=e.target.closest('[data-qq-retry]'); if(!b) return;
    e.preventDefault();
    const main=document.getElementById('qqLinkBtn');
    if(main && !main.disabled){ b.disabled=true; main.click(); }
  });
  // 顶部 nav：**留在当前标签页**切换（只有下拉菜单里的提取入口才新开标签）
  // 2026-11-03 改：此前是全部新标签打开，用户反馈"点任意入口都弹新标签"太吵。
  document.querySelectorAll('[data-nav]').forEach(n=>n.addEventListener('click',()=>{
    const v = n.dataset.nav;
    if(!v || v === 'extract') return;   // extract 是下拉菜单，由下面的面板处理
    const want = '#/' + v;
    if(location.hash !== want) location.hash = want;
  }));
  // 品牌 Logo：当前标签回首页
  const brand=document.querySelector('.brand');
  if(brand) brand.addEventListener('click', ()=>{ if(location.hash!=='#/home') location.hash='#/home'; });
  // 下拉项：在新标签页打开对应功能（原标签保持不变，和参考产品一致）
  document.getElementById('extractPanel').addEventListener('click', e=>{
    const item=e.target.closest('.dd-item'); if(!item) return;
    document.getElementById('extractPanel').classList.remove('open');
    const url=item.dataset.url || urlFor(item.dataset.navTo, item.dataset.key);
    window.open(url, '_blank');   // 由用户点击触发，不会被弹窗拦截
  });
  // 按 URL 打开对应视图（支持"功能在新标签页直达"）
  const r=routeFromHash();
  showView(r.view, r.key);
  if(r.taskId) renderHistoryResult(r.taskId);
  // 从服务端补进行中任务：覆盖"关掉页面/换标签页/清过浏览器数据"后重开的情况
  syncActiveFromServer();
  // 浏览器前进/后退时跟随 URL
  window.addEventListener('hashchange', ()=>{ const x=routeFromHash(); showView(x.view, x.key); if(x.taskId) renderHistoryResult(x.taskId); });
}

window._hPage=1, window._hPageSize=10;

async function loadHistory(){
  const kw=$('#hKeyword')?.value||'', st=$('#hStatus')?.value||'', pg=window._hPage;
  const q=new URLSearchParams({page:pg,pageSize:window._hPageSize});
  if(kw) q.set('keyword',kw);
  if(st) q.set('status',st);
  try{
    const j=await (await fetch(`${API}/history/list?${q}`)).json();
    if(j.code!==200) throw new Error(j.msg);
    renderHistoryList(j.data.list||[], j.data.total||0);
  }catch(e){ const list=$('#hList'); if(list) list.innerHTML='<div class="msg error show">加载失败: '+escapeHtml(e.message)+'</div>'; }
}

function renderHistoryList(items, total){
  const list=$('#hList'); if(!list) return;
  if(!items.length){ list.innerHTML='<div style="text-align:center;color:var(--muted);padding:3rem 0">暂无历史记录</div>'; $('#hPager').innerHTML=''; return; }
  const hm={'video-transcript':'视频','file_transcript':'文件','image-ocr':'图片','transcript':'视频'};
  const toolbar='<div class="row" style="margin:0 0 .7rem">'
    +'<label style="display:flex;align-items:center;gap:.4rem;font-weight:600;font-size:.82rem;cursor:pointer;margin:0">'
    +'<input type="checkbox" class="h-check" id="hSelectAll"> 全选本页</label>'
    +'<button type="button" class="btn sm" id="hBatchExport">批量导出</button>'
    +'<span id="hSelInfo" style="color:var(--muted);font-size:.8rem">已选 0 条</span>'
    +'</div>';
  let h=items.map(it=>{
    const stCls=it.status==='SUCCESS'?'ok':it.status==='FAILURE'?'fail':'run';
    const stTxt=it.status==='SUCCESS'?'成功':it.status==='FAILURE'?'失败':'进行中';
    const preview=escapeHtml((it.text_content||'').replace(/\n+/g,' ').slice(0,70));
    const tgt=historyResultTarget(it);
    const rurl=resultUrlFor(tgt.view, tgt.key, it.task_id);
    const id=escapeHtml(it.task_id||'');
    const type=escapeHtml(hm[it.task_type]||it.task_type||'任务');
    const title=escapeHtml(it.title||'(无标题)');
    const platform=escapeHtml(it.platform||'');
    const time=escapeHtml(it.created_at||'');
    return '<div class="h-item" data-id="'+id+'" data-url="'+escapeHtml(rurl)+'">'
      +'<div class="h-left">'
      +'<input type="checkbox" class="h-check" data-hid="'+id+'">'
      +'<span class="h-type">'+type+'</span>'
      +'<div class="h-main"><div class="h-title">'+title+'</div>'
      +'<div class="h-sub">'+(platform?('['+platform+'] '):'')+preview+'</div>'
      +'<div class="h-time">'+time+'</div></div>'
      +'</div>'
      +'<div class="h-right"><span class="status-tag '+stCls+'">'+stTxt+'</span>'
      +'<button class="btn sm ghost" data-hact="export">导出</button>'
      +'<button class="btn sm ghost" data-hact="detail">打开结果</button>'
      +'<button class="btn sm ghost" data-hact="del">删除</button></div>'
      +'</div>';
  }).join('');
  list.innerHTML=toolbar+'<div class="h-list">'+h+'</div>';
  // 分页
  const pages=Math.max(1,Math.ceil(total/window._hPageSize));
  const pager=$('#hPager'); pager.innerHTML='<span style="color:var(--muted);font-size:.85rem">共 '+total+' 条</span><button class="btn sm ghost" id="hPrevPage">上一页</button>'
    +'<span style="font-size:.85rem">'+window._hPage+' / '+pages+'</span><button class="btn sm ghost" id="hNextPage">下一页</button>';
  pagify(pages);
}

function pagify(pages){
  const prev=$('#hPrevPage'), next=$('#hNextPage');
  if(prev) prev.onclick=()=>{ if(window._hPage>1){ window._hPage--; loadHistory(); } };
  if(next) next.onclick=()=>{ if(window._hPage<pages){ window._hPage++; loadHistory(); } };
}

// 历史记录 → 回到该任务对应的完整结果页（导出 / AI 纠错 / 生成笔记 / 视频预览都可用）
// 平台→视图 key 的映射见前面 PLATFORM_VIEW_KEYS（进行中任务恢复也用同一份）

function historyResultTarget(d){
  if(d.task_type==='image-ocr'){
    return {view:'image', key:'ocr', box:'#iresult'};
  }
  if(d.task_type==='file_transcript'){
    const audio=/\.(mp3|wav|m4a|aac|ogg|opus|flac|amr)$/i.test((d.title||'').trim());
    return {view:'file', key:audio?'audio':'video', box:'#fresult'};
  }
  return {view:'video', key:PLATFORM_VIEW_KEYS[d.platform]||'douyin', box:'#vresult'};
}

function historyToResult(d){
  let extra={}; try{ extra=JSON.parse(d.extra||'{}'); }catch(e){}
  return {
    taskId:d.task_id, taskType:d.task_type, platform:d.platform, title:d.title, content:d.content,
    textContent:d.text_content, cover:d.cover, duration:d.duration,
    uploader:d.uploader, webpageUrl:d.webpage_url,
    channelMeta:extra.channelMeta || null,
    videoUrlList:(extra.videoUrlList && extra.videoUrlList.length) ? extra.videoUrlList : null,
    segments:extra.segments || null,
    frameText:extra.frameText || null,
    frameMainText:extra.frameMainText || null,
    frameSceneText:extra.frameSceneText || null,
  };
}

async function renderHistoryResult(id){
  let d;
  try{
    const j=await (await fetch(`${API}/history/detail?taskId=${encodeURIComponent(id)}`)).json();
    d=j.data;
  }catch(e){ notify('记录加载失败：'+e.message,'error'); return; }
  if(!d){ notify('记录不存在或已删除','error'); return; }
  let tgt=historyResultTarget(d);
  // 视频号页打开文件转写任务（贴链接下载的片子）：留在视频号页渲染（视频/截图），不去「视频转文字」页
  if(d.task_type==='file_transcript' && currentView==='video' && currentKey==='qqvideo'){
    tgt={view:'video', key:'qqvideo', box:'#vresult'};
  }
  if(currentView!==tgt.view || currentKey!==tgt.key) showView(tgt.view, tgt.key);
  const box=document.querySelector(tgt.box);
  if(!box) return;
  // 同一任务已经渲染过（含快照恢复）→ 不重复渲染，保留已截好的图
  if([...box.querySelectorAll('[data-task-id]')].some(el=>el.dataset.taskId===id)){
    try{ history.replaceState(null,'',resultUrlFor(tgt.view, tgt.key, id)); }catch(e){}
    return;
  }
  if(d.status!=='SUCCESS'){
    const tid=escapeHtml(id);
    const platform=escapeHtml(d.platform||'');
    const title=escapeHtml(d.title||'(无标题)');
    box.innerHTML='<div class="card" data-task-id="'+tid+'">'
      +'<div class="meta"><span class="pill platform">'+platform+'</span>'
      +'<span class="pill status">失败</span></div>'
      +'<div class="result-title">'+title+'</div>'
      +'<div class="msg error show">'+escapeHtml(d.error_msg||'任务失败')+'</div></div>';
  }else if(tgt.view==='image'){
    renderImageResult(d.text_content||'', box, id);
  }else{
    renderVideoResult(historyToResult(d), box);
  }
  snapshotResult();
  try{ history.replaceState(null,'',resultUrlFor(tgt.view, tgt.key, id)); }catch(e){}
  box.scrollIntoView({behavior:'smooth'});
}

// ---------- 刷新直链（抖音/快手直链几小时过期） ----------
async function refreshMedia(taskId, btn){
  if(!taskId) return;
  const old = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '刷新中…'; }
  try{
    const j = await (await fetch(API + '/transcript/refreshMedia', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({taskId})})).json();
    if(j.code !== 200){ notify(j.msg || '刷新失败', 'error'); return; }
    notify(j.msg || '已刷新直链', 'success');
    // 让 <video> 拿到新流（同 URL 可能被浏览器缓存住旧的分片）
    window.MEDIA_TICK = Date.now();
    // 强制重渲染这张结果卡（renderHistoryResult 对已渲染任务会跳过，先移除旧卡）
    const card = btn && btn.closest('[data-task-id]');
    const host = card && card.parentElement;
    if(card) card.remove();
    if(host) await renderHistoryResult(taskId);
  }catch(e){ notify('刷新失败：' + e.message, 'error'); }
  finally{ if(btn && btn.isConnected){ btn.disabled = false; btn.textContent = old || '刷新直链'; } }
}

// ---------- 视频号：贴链接直接提取（2026-11-05 主路径） ----------
async function qqLinkExtract(){
  const btn=document.getElementById('qqLinkBtn');
  const inp=document.getElementById('qqUrlInput');
  const m=document.getElementById('vmsg');
  let link=(inp.value||'').trim();
  if(!link){ m.className='msg error show'; m.textContent='请先粘贴视频号分享链接'; return; }
  if(!/^https?:\/\//i.test(link)){
    // 允许整段分享文案：从里面抠出第一个链接
    const mm=link.match(/https?:\/\/[^\s"'<>，。；、）)\]]+/);
    if(!mm){ m.className='msg error show'; m.textContent='没识别到链接，请粘贴完整地址（或带链接的整段分享文案）'; return; }
    link=mm[0].replace(/[),.;，。]+$/,''); inp.value=link;
  }
  if(btn){ btn.disabled=true; btn.textContent='提取中…'; }
  m.className='msg';
  // 没绑定凭证时先停一下：第一次点只提醒去登录；按钮改成「只要文案（无视频）」
  // 明示后果——2026-11-05 用户要求：正常提取必须出视频，不能让"只有文案"看起来像成功
  const logged = await refreshQqLoginTip();
  // 已经提醒过一次、按钮也改成了「只要文案（无视频）」→ 这次点击就是用户明确接受只要文字
  if(!logged && window._qqLoginWarned) window._qqTextOnlyOk = true;
  if(!logged && !window._qqTextOnlyOk){
    window._qqLoginWarned = true;
    if(btn){ btn.disabled=false; btn.textContent='只要文案（无视频）'; }
    const tip=document.getElementById('qqLoginTip');
    if(tip){ try{ tip.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){} }
    m.className='msg error show';
    m.textContent='还没绑定视频号凭证，现在拿不到视频。点上面「去登录」微信扫码一次（约 60 天有效）后重新点「提取」，才会出视频；实在只要文字，就点「只要文案（无视频）」。';
    return;
  }
  // 视频号直链失败会自动重试（后端最多 3 次），POST 要等重试结束才返回，
  // 先说明一句，避免按钮长时间「提取中…」被当成卡死
  m.className='msg show';
  m.textContent='正在提取…（网络抖动会自动重试几次，最多约 1 分钟）';
  setTaskLoading({kind:'video'}, '正在提取...');
  const vresult=$('#vresult');
  if(vresult && vresult.dataset.stack === undefined) vresult.innerHTML='';
  try{
    const j=await api('/transcript/doTask',{method:'POST',body:JSON.stringify({appType:'douchong',workUrl:link,type:'text',targetLanguage:'auto',whisperModel:(($('#qqwhisper')||{}).value||'auto'),ocrFrames:true})});
    if(j.code!==200||!j.data){ throw new Error(j.msg||'创建失败'); }
    const entry={taskId:j.data.taskId, view:'video', key:currentKey, kind:'video', done:false, status:'RUNNING', message:'排队中'};
    registerActive(entry);
    pollTaskEntry(entry);
  }catch(e){ clearTaskLoading({kind:'video'}); m.className='msg error show'; m.textContent=e.message; }
  finally{ if(btn){ btn.disabled=false; btn.textContent='提取'; } }
}

async function runAiCorrect(taskId){
  const box = document.getElementById('aiBox-' + taskId);
  if(!box) return;
  box.innerHTML = '<div class="loading show"><div class="spinner"></div>'
    + '<span>AI 正在通读全文纠错（约 30-60 秒）...</span></div>';
  try{
    const r = await fetch(API + '/ai/correct', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({taskId})
    });
    const j = await r.json();
    if(!r.ok || !j.data || !j.data.ok){
      const m = j.msg || '纠错失败';
      box.innerHTML = '<div class="msg error show">' + escapeHtml(m) + '</div>';
      notify(m, 'error');          // 模型不可用等错误直接弹出来，不用去翻结果区
      return;
    }
    _corrCache[taskId] = { original: null, corrected: j.data.corrected,
                           changes: j.data.changes || [],
                           punct: j.data.punctuationCount || 0, model: j.data.model };
    renderCorrection(taskId, 'corrected');
  }catch(e){
    box.innerHTML = '<div class="msg error show">纠错请求失败：' + escapeHtml(e.message) + '</div>';
  }
}

function renderCorrection(taskId, mode){
  const box = document.getElementById('aiBox-' + taskId);
  const c = _corrCache[taskId];
  if(!box || !c) return;
  // 原文从页面现有文本块取
  if(c.original === null){
    const el = document.querySelector('[data-copy-src="txt"]');
    c.original = el ? el.textContent : '';
  }
  const body = mode === 'original' ? c.original : c.corrected;
  // 一处都没改（也无需规范标点）时，纠错版与原文一字不差——再把整段文本渲染出来，
  // 就是同一段话在页面上出现的第三遍，还会多出"看原文/看纠错版"的无效切换。
  const nothing = !c.changes.length && !c.punct;
  const changes = c.changes.map(x => '<li><code>' + escapeHtml(x.from) + '</code> → <code>'
      + escapeHtml(x.to) + '</code></li>').join('');
  box.innerHTML = '<div class="card" style="margin-top:1rem;border-color:#ddd6fe">'
    + '<div class="meta"><span class="pill platform">AI 纠错 · ' + escapeHtml(c.model || 'LLM') + '</span>'
    + '<span class="pill dur">' + (nothing ? '无改动' : '实质修改 ' + c.changes.length + ' 处') + '</span>'
    + (c.punct ? '<span class="pill status">标点规范化 ' + c.punct + ' 处</span>' : '')
    + (nothing ? '' :
        '<button class="copy" onclick="switchCorr(\'' + taskId + '\',\'original\')">看原文</button>'
        + '<button class="copy" onclick="switchCorr(\'' + taskId + '\',\'corrected\')">看纠错版</button>'
        + '<button class="copy" onclick="exportCorrected(\'' + taskId + '\')">导出纠错版</button>')
    + '</div>'
    + (nothing
        ? '<div style="color:var(--muted);font-size:.82rem;margin-top:.35rem">'
          + '已检查，与上方正文完全一致，无需改动。</div>'
        : '<div class="section-label">' + (mode === 'original' ? '原文（ASR 结果）' : '纠错版') + '</div>'
          + '<div class="transcript" style="max-height:340px">' + escapeHtml(body) + '</div>'
          + (c.changes.length ? '<div class="section-label">改动清单</div><ul class="corr-list">' + changes + '</ul>' : ''))
    + '</div>';
}

function switchCorr(taskId, mode){ renderCorrection(taskId, mode); }
function exportCorrected(taskId){ openExportModal([taskId], true); }

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
